<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5c63">
<title>Exploring Oman: wadis, beaches &amp; itineraries</title>
<meta name="description" content="Wadis, beaches and hidden corners of Oman: maps, logistics and a trip planner, from a licensed Omani guide.">

<!-- Social previews: what the link looks like when shared on WhatsApp /
     Instagram / anywhere. Without these it's a bare grey URL. These are
     absolute on purpose (scrapers don't resolve relative paths), so they are
     the one place a domain change has to be made by hand. Now exploresoman.com. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Exploring Oman: the guide by @hussain_explores">
<meta property="og:description" content="90+ wadis, beaches and hidden corners with real logistics, maps and a trip planner. By a licensed Omani guide. Free during launch season.">
<meta property="og:url" content="https://exploresoman.com/">
<meta property="og:image" content="https://exploresoman.com/assets/wadis/wadi-shab.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Exploring Oman: the guide by @hussain_explores">
<meta name="twitter:description" content="90+ spots with real logistics, maps and a trip planner. Free during launch season.">
<meta name="twitter:image" content="https://exploresoman.com/assets/wadis/wadi-shab.jpg">

<!-- The banner photo is the first thing anyone sees: fetch it FIRST, before
     the browser discovers it late inside the stylesheet. Dedicated 91KB
     asset, not the 267KB card photo it's cropped from. -->
<link rel="preload" as="image" href="assets/banner.jpg" fetchpriority="high">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Explore Oman">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============================ HEADER ============================ -->
<header class="topbar">
  <div class="topbar-inner">
    <!-- Wordmark lockup. The mark was an emoji compass, which renders as a
         different drawing on every phone and can't take the rank tint. This
         is a drawn khanjar-and-sun mark: Omani, ownable, and it inherits
         currentColor like the rest of the icon set. -->
    <a class="brand" href="#/wadis" aria-label="Exploring Oman, home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="20" cy="20" r="17" opacity=".28"/>
          <path d="M20 6.5a13.5 13.5 0 0 1 0 27" opacity=".28"/>
          <path d="M13 15.5c4.5-2.2 9.5-2.2 14 0-1.6 6.4-5.2 10.6-7 12.2-1.8-1.6-5.4-5.8-7-12.2z"
                fill="currentColor" fill-opacity=".16"/>
          <path d="M13 15.5c4.5-2.2 9.5-2.2 14 0-1.6 6.4-5.2 10.6-7 12.2-1.8-1.6-5.4-5.8-7-12.2z"/>
          <path d="M20 15v12.7" opacity=".55"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Exploring Oman</strong>
        <small id="brandSub">by @hussain_explores</small>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="pill pill-ghost" id="unlockBtn">Unlock</button>
    </div>
  </div>
  <!-- the explorer's HUD: rank ring, rank name, progress. Filled by app.js on
       every route, so it's on every tab rather than just Explore. -->
  <div class="hud" id="topHud"></div>
  <div class="livingline" id="livingLine"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<!-- ============================ SEARCH ============================ -->
<div class="searchbar" id="searchbar" hidden>
  <input type="search" id="searchInput" placeholder="Search wadis, beaches, spots…" autocomplete="off">
  <button class="icon-btn" id="searchClose" aria-label="Close search">✕</button>
</div>

<!-- ============================= MAIN ============================= -->
<main id="view" class="view"></main>

<!-- ========================= DETAIL SHEET ========================= -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- ========================= UNLOCK MODAL ========================= -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="sheet-close" id="modalClose" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- ============================ TOAST ============================= -->
<div class="toast" id="toast" hidden></div>

<script src="data/content.js"></script>
<script src="js/analytics.js"></script>
<script src="js/unlock.js"></script>
<script src="js/planner.js"></script>
<script src="js/app.js"></script>
<script>
  // The service worker serves css/js stale-while-revalidate, which is right for
  // a traveller in a wadi with no signal and WRONG on a laptop: every reload
  // would show you the previous edit, forever. So it's off on localhost, and
  // any worker left behind from an earlier session is torn down on sight.
  var LOCAL = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !LOCAL) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        /* THE STALE-REFRESH PROBLEM.
           stale-while-revalidate hands you the cached copy instantly and
           fetches the new one behind your back, so the reload right after a
           deploy still renders the OLD build and only the reload after that
           shows the new one. That is correct for a traveller in a wadi and
           maddening for everyone else: "I refreshed and nothing changed, I
           had to open a different browser profile to see it."

           So: when a new worker finishes installing, say so, and let the
           reader take the update with one tap. No surprise reloads, because
           yanking the page out from under someone mid-wadi is worse than
           being one version behind for a minute. */
        // Has the reader started reading? If they haven't, swapping the build
        // under them costs nothing and they simply get the current version.
        var touched = false;
        ['scroll', 'pointerdown', 'keydown'].forEach(function (ev) {
          addEventListener(ev, function () { touched = true; }, { once: true, passive: true });
        });

        function offer(worker) {
          if (!worker) return;
          worker.addEventListener('statechange', function () {
            if (worker.state !== 'installed' || !navigator.serviceWorker.controller) return;
            var take = function () { worker.postMessage({ type: 'SKIP_WAITING' }); };
            if (!touched) { take(); return; }          // silent, they hadn't started
            window.__omanUpdateReady = take;            // otherwise: their call
            if (window.__omanShowUpdate) window.__omanShowUpdate();
          });
        }
        offer(reg.installing);
        reg.addEventListener('updatefound', function () { offer(reg.installing); });

        // The new worker took over: reload once so the page matches its files.
        var reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (reloaded) return;
          reloaded = true;
          location.reload();
        });

        // Check for a new build whenever the app is brought back to the front,
        // otherwise an installed PWA can sit on one version for days.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
      }).catch(function () {});
    });
  } else if (LOCAL && 'serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister())))
      .then(() => caches.keys())
      .then(ks => Promise.all(ks.map(k => caches.delete(k))))
      .catch(()=>{});
  }
</script>
</body>
</html>
