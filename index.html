<body>

<!-- ============================ HEADER ============================ -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/wadis">
      <span class="brand-mark">🧭</span>
      <span class="brand-text">
        <strong>Exploring Oman</strong>
        <small id="brandSub">by @hussain_explores</small>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="pill pill-ghost" id="unlockBtn">Unlock</button>
    </div>
  </div>
  <!-- the explorer's HUD: rank ring, rank name, progress. Filled by app.js on
       every route, so it's on every tab rather than just Explore. -->
  <div class="hud" id="topHud"></div>
  <div class="livingline" id="livingLine"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<!-- ============================ SEARCH ============================ -->

  <input type="search" id="searchInput" placeholder="Search wadis, beaches, spots…" autocomplete="off">
  <button class="icon-btn" id="searchClose" aria-label="Close search">✕</button>
</div>

<!-- ============================= MAIN ============================= -->
<main id="view" class="view"></main>

<!-- ========================= DETAIL SHEET ========================= -->

<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">

</section>

<!-- ========================= UNLOCK MODAL ========================= -->

  </div>
</div>

<!-- ============================ TOAST ============================= -->
<div class="toast" id="toast" hidden></div>

<script src="data/content.js"></script>
<script src="js/analytics.js"></script>
<script src="js/unlock.js"></script>
<script src="js/planner.js"></script>
<script src="js/app.js"></script>
<script>
  // The service worker serves css/js stale-while-revalidate, which is right for
  // a traveller in a wadi with no signal and WRONG on a laptop: every reload
  // would show you the previous edit, forever. So it's off on localhost, and
  // any worker left behind from an earlier session is torn down on sight.
  var LOCAL = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !LOCAL) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  } else if (LOCAL && 'serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(rs => Promise.all(rs.map(r => r.unregister())))
      .then(() => caches.keys())
      .then(ks => Promise.all(ks.map(k => caches.delete(k))))
      .catch(()=>{});
  }
</script>
</body>
