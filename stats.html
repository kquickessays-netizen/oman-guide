<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b1f22">
<title>Exploring Oman — Stats</title>

<!--
  ===========================================================================
  THE STATS DESK.  exploresoman.com/stats.html
  ---------------------------------------------------------------------------
  WHO CAN SEE THIS DATA
  Nobody, until they sign in. The publishable key below is the same one the
  public app already ships, and on its own it can only INSERT (see
  delivery/backend-schema.sql). Reading needs a Supabase Auth session, which
  needs an email and password you created by hand.

  SETUP, ONCE (5 minutes):
    1. Open delivery/dashboard-access.sql, put YOUR TWO EMAILS in step 1 of
       it, then run the whole file in Supabase -> SQL Editor.
       Reading is allow-listed to those addresses, because this project had
       public sign-ups switched on and the key below is public: without the
       allow-list, a stranger could sign up and read the email list.
    2. Authentication -> Sign In / Providers -> Email -> turn OFF "Allow new
       users to sign up". (Belt and braces, do it anyway.)
    3. Authentication -> Users -> "Add user" -> one for each of you, using
       the same two addresses, tick "Auto Confirm User".
    4. Open exploresoman.com/stats.html and sign in.

  WHY NO LIBRARY: the whole project has no build step and no dependencies.
  Supabase Auth and PostgREST are both plain HTTP, so this page is one file
  of vanilla JS that will still run in five years.

  WHAT IT CANNOT DO: there is no UPDATE or DELETE policy for a signed-in
  user, so nothing on this page can change or destroy a row. It reads.
  ===========================================================================
-->

<style>
/* =============================================================================
   Palette validated with the dataviz validator against this panel surface
   (#122c30, dark mode): lightness band, chroma floor, CVD separation,
   normal-vision floor and contrast all PASS.
   Series slots  #199e70 / #c98500 / #3987e5 / #d95926
   The previous pink (#e4739f) and red (#e2695f) were 8.4 apart on the
   normal-vision scale — below the 15 floor, i.e. genuinely hard to tell
   apart even with full colour vision. Both replaced.
   Text never wears a series colour; a coloured mark beside it carries identity.
   ========================================================================== */
:root{
  --bg:#0b1f22; --panel:#122c30; --panel-2:#173539;
  --line:#1e4046; --line-soft:#193a3f;
  --ink:#eef7f5; --ink-2:#b6cfcc; --muted:#8fb0ad;

  --s1:#199e70; --s2:#c98500; --s3:#3987e5; --s4:#d95926;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;

  --brand:#3fb0a8;                 /* UI chrome only, never a data mark */
  --radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 80px}

/* ---------------------------------------------------------------- sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate form{width:100%;max-width:360px;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:26px 24px}
.gate h1{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.gate p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.gate label{display:block;font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.gate input{width:100%;margin:0 0 14px;padding:11px 13px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit}
.gate input:focus{outline:2px solid var(--brand);outline-offset:1px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);
  color:#04201d;font-weight:800}
.btn:disabled{opacity:.55;cursor:default}
.err{margin:12px 0 0;color:var(--bad);font-size:13px;min-height:1.2em}

/* ------------------------------------------------------------------- head */
header{position:sticky;top:0;z-index:20;background:rgba(11,31,34,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{max-width:1120px;margin:0 auto;padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;margin-right:auto;font-size:15.5px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.range{display:flex;gap:3px;background:var(--panel);padding:3px;border-radius:999px;
  border:1px solid var(--line)}
.range button{border:0;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:700;padding:6px 13px;border-radius:999px}
.range button.on{background:var(--brand);color:#04201d}
.daynav{display:flex;align-items:center;gap:4px}
.daynav .ghost{padding:6px 11px;font-size:14px;line-height:1}
.daynav .ghost:disabled{opacity:.35;cursor:default}
.daynav input{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;color-scheme:dark}
.daynav input.on{border-color:var(--brand);color:var(--ink)}
.daylink{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);
  cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.daylink:hover{color:var(--brand);text-decoration-color:var(--brand)}
.zero{color:var(--muted);opacity:.55}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700}
.ghost:hover{color:var(--ink);border-color:var(--brand)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 18px 10px;display:flex;gap:5px;
  overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:transparent;
  color:var(--muted);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button.on{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
nav.tabs .n{font-size:11px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

/* --------------------------------------------------------------- sections */
h2.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);
  margin:30px 0 12px;font-weight:800;display:flex;align-items:center;gap:9px}
h2.sec::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand);flex:0 0 auto}
h2.sec .pill{text-transform:none;letter-spacing:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ------------------------------------------------------------------ tiles */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:800}
.tile .v{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:7px 0 3px;
  line-height:1.05;color:var(--ink)}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
/* A tile is a headline, not a series: the accent is a rule, not the number. */
.tile.teal{border-left:3px solid var(--s1)}
.tile.gold{border-left:3px solid var(--s2)}
.tile.pink{border-left:3px solid var(--s3)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px;overflow:hidden}
.note{color:var(--ink-2);font-size:13px;line-height:1.6;margin:11px 2px 0;
  padding:11px 13px;background:var(--panel);border:1px solid var(--line-soft);
  border-left:3px solid var(--muted);border-radius:0 10px 10px 0}
.note b{color:var(--ink)}

/* ------------------------------------------------------------------ chart
   Thin marks, 4px rounded data-ends anchored to the baseline, 2px gap
   between bars, recessive gridlines, hover tooltip. */
.chartwrap{position:relative;padding:4px 0 0}
.grid{position:absolute;inset:0 0 26px 0;pointer-events:none}
.grid i{position:absolute;left:0;right:0;height:1px;background:var(--line-soft)}
.grid b{position:absolute;left:0;transform:translateY(-50%);font-size:10.5px;
  color:var(--muted);font-weight:600;background:var(--panel);padding:0 4px;
  font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;position:relative}
.bars .b{flex:1 1 0;min-width:2px;background:var(--s1);border-radius:4px 4px 0 0;
  position:relative;transition:filter .12s}
.bars .b:hover{filter:brightness(1.25)}
.bars .b.peak{background:var(--s2)}
.bars .b span{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:5px 9px;font-size:11.5px;color:var(--ink);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .1s;z-index:5;
  font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bars .b:hover span{opacity:1}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;
  margin-top:9px;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ table */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:-15px;padding:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 15px;border-bottom:1px solid var(--line-soft);
  vertical-align:middle;white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  font-weight:800;position:sticky;top:0;background:var(--panel)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:240px}
tbody tr:hover{background:var(--panel-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:4px;bottom:4px;
  background:color-mix(in srgb,var(--s1) 22%,transparent);border-radius:0 4px 4px 0}
.bar-cell span{position:relative;color:var(--ink-2)}
tbody tr:first-child .bar-cell span{color:var(--ink);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;
  font-weight:700;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.up{background:rgba(12,163,12,.15);color:var(--good);border-color:transparent}
.pill.down{background:rgba(208,59,59,.15);color:var(--bad);border-color:transparent}
.stars{color:var(--s2);letter-spacing:1px}
/* ----------------------------------------------------------------- actions
   Small, quiet, and never the loudest thing in a row: the data is what you
   came to read. The one primary action per row gets the series colour; a
   destructive one is text-red only, never a red slab. */
.act{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);
  padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;
  margin:0 5px 0 0;white-space:nowrap}
.act:hover:not(:disabled){color:var(--ink);border-color:var(--brand)}
.act.go{background:var(--s1);border-color:var(--s1);color:#04201d}
.act.go:hover:not(:disabled){color:#04201d;filter:brightness(1.08)}
.act.bad{color:var(--bad)}
.act.bad:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.act:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;z-index:60;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad)}
.empty{color:var(--muted);padding:28px 4px;text-align:center;font-size:13.5px}
.hide{display:none !important}
@media(max-width:640px){
  .tile .v{font-size:25px}
  .hrow{gap:9px}
  .brand{width:100%;margin-right:0}
  .bars{height:120px}
}
</style>
</head>
<body>

<!-- ------------------------------------------------------------- sign in -->
<div class="gate" id="gate">
  <form id="loginForm" autocomplete="on">
    <h1>Exploring Oman</h1>
    <p>Stats desk. Sign in with the account made for you in Supabase.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- ------------------------------------------------------------ dashboard -->
<div id="app" class="hide">
  <header>
    <div class="hrow">
      <div class="brand">Exploring Oman <small id="who">dashboard</small></div>
      <div class="range" id="range">
        <button data-day="0">Today</button>
        <button data-day="-1">Yesterday</button>
        <button data-d="7">7d</button>
        <button data-d="30" class="on">30d</button>
        <button data-d="90">90d</button>
        <button data-d="0">All</button>
      </div>
      <div class="daynav">
        <button class="ghost" id="dayPrev" aria-label="Previous day" title="Previous day">‹</button>
        <input type="date" id="dayPick" aria-label="Show one day" title="Show one day">
        <button class="ghost" id="dayNext" aria-label="Next day" title="Next day">›</button>
      </div>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="out">Sign out</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="wrap" id="view"></div>
</div>

<script>
(() => {
  "use strict";

  /* The same publishable key the public app ships. On its own it can only
     INSERT; every read below rides on the signed-in user's token. */
  const URL_ = "https://bfneutpsjyfqferkublh.supabase.co";
  const KEY  = "sb_publishable_kHrIcnawDTYNmumFholkYQ_F8k7Z24d";
  const SESSION_KEY = "oman_stats_session";

  const $ = s => document.querySelector(s);
  const el = (t, c, h) => { const n = document.createElement(t);
    if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
  const nf = n => (n == null ? "0" : Number(n).toLocaleString("en-GB"));

  /* The range: `days` back from now (0 = all time), or ONE local day when
     `day` is set ("2026-09-30"), which then wins over `days`. */
  let session = null, DATA = null, days = 30, day = null, tab = "overview";
  let userDetail = null;   // account id whose drill-down page is open (Accounts tab)
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch {}

  /* ------------------------------------------------------------------ auth */
  async function signIn(email, password) {
    const r = await fetch(URL_ + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ("Sign-in failed (" + r.status + ")"));
    return j;
  }

  async function refreshToken() {
    if (!session || !session.refresh_token) return false;
    const r = await fetch(URL_ + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if (!r.ok) return false;
    session = await r.json();
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return true;
  }

  function signOut() {
    session = null;
    localStorage.removeItem(SESSION_KEY);
    $("#app").classList.add("hide");
    $("#gate").classList.remove("hide");
  }

  /* ------------------------------------------------------------------ read
     One helper for every table. PostgREST caps a response at 1000 rows, so
     this pages until it has everything and says so if it stops. */
  /* ================== WRITE ==================================
     Reads ride on the signed-in user's token; so do writes. RLS decides what
     is allowed, so this cannot do anything the database has not granted:
     UPDATE on bookings and reviews, DELETE on reviews and subscribers, and
     nothing at all on events. A lead can be archived but never deleted.

     The row object is patched in memory and the tab redrawn, rather than
     refetching 2,400 events for a one-field change. */
  async function write(table, id, patch, method) {
    const r = await fetch(URL_ + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
      method: method || "PATCH",
      headers: {
        apikey: KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: method === "DELETE" ? undefined : JSON.stringify(patch)
    });
    if (r.status === 401 && await refreshToken()) return write(table, id, patch, method);
    if (!r.ok) throw new Error((await r.text().catch(() => "")) || ("HTTP " + r.status));
  }

  let toastT = null;
  function toast(msg, bad) {
    let t = $("#toast");
    if (!t) { t = el("div", "toast"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.className = "toast on" + (bad ? " bad" : "");
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.className = "toast"; }, bad ? 6000 : 2200);
  }

  /* One handler for every action button, wired after each draw. */
  async function act(btn) {
    const { table, id, field, value, del } = btn.dataset;
    const list = table === "bookings" ? DATA.bookings
               : table === "reviews"  ? DATA.reviews
               : DATA.subs;
    const rowObj = list.find(x => String(x.id) === String(id));
    btn.disabled = true;
    try {
      if (del === "1") {
        if (!confirm("Delete this permanently? This cannot be undone.")) { btn.disabled = false; return; }
        await write(table, id, null, "DELETE");
        const i = list.indexOf(rowObj); if (i > -1) list.splice(i, 1);
        toast("Deleted.");
      } else {
        // "true"/"false" arrive as strings off the button dataset; the
        // `published` column is a real boolean, so coerce before PATCHing.
        const v2 = value === "true" ? true : value === "false" ? false : value;
        const patch = { [field]: v2, handled_at: new Date().toISOString() };
        await write(table, id, patch);
        if (rowObj) Object.assign(rowObj, patch);
        toast(value === "new" ? "Reopened." : "Saved: " + value + ".");
      }
      draw();
    } catch (e) {
      btn.disabled = false;
      toast("Could not save: " + String(e.message || e).slice(0, 120), true);
    }
  }

  /* Buttons are rebuilt on every draw, so they are wired after each draw
     rather than once at startup. "Copy tip" never touches the database. */
  function wireActions(scope) {
    scope.querySelectorAll("button.act").forEach(b => {
      b.onclick = () => {
        if (b.dataset.copy != null) {
          navigator.clipboard.writeText(b.dataset.copy)
            .then(() => toast("Tip copied — paste it into content.js"))
            .catch(() => toast("Could not reach the clipboard", true));
          return;
        }
        act(b);
      };
    });
  }

  async function readAll(table, query, cap) {
    cap = cap || 20000;
    const out = [];
    let from = 0;
    const PAGE = 1000;
    for (;;) {
      const r = await fetch(URL_ + "/rest/v1/" + table + "?" + query, {
        headers: {
          apikey: KEY,
          Authorization: "Bearer " + session.access_token,
          Range: from + "-" + (from + PAGE - 1),
          "Range-Unit": "items"
        }
      });
      if (r.status === 401) {
        if (await refreshToken()) continue;
        throw Object.assign(new Error("Session expired."), { auth: true });
      }
      if (!r.ok) {
        const t = await r.text().catch(() => "");
        // A missing table or a missing SELECT policy both land here.
        throw new Error(table + ": " + r.status + " " + t.slice(0, 160));
      }
      const rows = await r.json();
      out.push.apply(out, rows);
      if (rows.length < PAGE || out.length >= cap) break;
      from += PAGE;
    }
    return out;
  }

  /* DAYS ARE LOCAL. The dashboard is read in Muscat, so a day runs midnight
     to midnight on this computer's clock, not UTC's: 11pm in Muscat is still
     today, not tomorrow. */
  const pad = n => String(n).padStart(2, "0");
  const localDay = d => { d = new Date(d);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const dayStart = k => new Date(k + "T00:00:00");
  const addDays = (k, n) => { const d = dayStart(k); d.setDate(d.getDate() + n); return localDay(d); };
  const today = () => localDay(new Date());
  const dayLabelOf = k => dayStart(k).toLocaleDateString("en-GB",
    { weekday: "short", day: "numeric", month: "short" });

  const sinceISO = () => day ? dayStart(day).toISOString()
    : days ? new Date(Date.now() - days * 864e5).toISOString()
    : "1970-01-01T00:00:00Z";
  const untilISO = () => day ? dayStart(addDays(day, 1)).toISOString() : null;
  const inWindow = iso => { const t = new Date(iso);
    return t >= new Date(sinceISO()) && (!untilISO() || t < new Date(untilISO())); };

  /* The chart's x-axis for the range: 24 hours when one day is picked,
     otherwise one slot per local day, ending today. */
  const slotOf = iso => day ? new Date(iso).getHours() : localDay(iso);
  function slots(spanDays) {
    if (day) return Array.from({ length: 24 }, (_, h) => ({ key: h, day, hour: h, label: pad(h) + ":00" }));
    const out = [];
    for (let i = spanDays - 1; i >= 0; i--) { const k = addDays(today(), -i); out.push({ key: k, day: k }); }
    return out;
  }

  /* RPC — for reads that need SECURITY DEFINER server-side (the accounts
     list joins auth.users, which PostgREST will not expose as a table). */
  async function rpc(fn, args) {
    const r = await fetch(URL_ + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        apikey: KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(args || {})
    });
    if (r.status === 401 && await refreshToken()) return rpc(fn, args);
    if (!r.ok) throw new Error(fn + ": " + r.status + " " + (await r.text().catch(() => "")).slice(0, 120));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  async function loadAll() {
    const since = "created_at=gte." + sinceISO() + (untilISO() ? "&created_at=lt." + untilISO() : "");
    const [events, subs, bookings, reviews] = await Promise.all([
      readAll("events", since + "&select=created_at,event,props,device_id,email&order=created_at.desc"),
      readAll("subscribers", "select=*&order=created_at.desc"),
      readAll("bookings", "select=*&order=created_at.desc"),
      readAll("reviews", "select=*&order=created_at.desc")
    ]);
    /* Accounts arrive separately and FAIL SOFT: until
       delivery/stats-users-access.sql has been run, these three reads 404 /
       403, and the Accounts tab shows the setup note instead of the
       dashboard dying. */
    let accounts = null, usaves = [], uvisits = [], udevices = [];
    try {
      [accounts, usaves, uvisits] = await Promise.all([
        rpc("dashboard_users"),
        readAll("user_saves", "select=spot_id,user_id,created_at&order=created_at.desc"),
        readAll("user_visits", "select=spot_id,user_id,created_at&order=created_at.desc")
      ]);
      // Separate try: user_devices arrived later than the rest of the
      // accounts setup, and its absence should not blank the whole tab.
      try { udevices = await readAll("user_devices", "select=*&order=last_seen.desc"); }
      catch (e2) { udevices = []; }
    } catch (e) { accounts = null; usaves = []; uvisits = []; }
    let internalIds = [];
    try { internalIds = (await readAll("events", "event=eq.internal&select=device_id")).map(r => r.device_id); } catch (e3) {}
    const kept = notVisitors(events, internalIds);
    return { events: kept.events, dropped: kept.dropped, subs, bookings, reviews, accounts, usaves, uvisits, udevices };
  }

  /* NOT VISITORS (18 Oct 2026). Dropped before anything is counted, history
     included, so every tile and chart is real people only:
     - devices marked as ours: opened the site once with ?me=on (Ali,
       Hussain), which sends one "internal" event (js/analytics.js, top);
     - Ali's laptop and the test browsers run on it: Windows, Oman time,
       screen width 0 / 390 / 1280 / 1440 / 1536 (390 on Windows is never a
       real phone; 1536 is that laptop's own screen);
     - obvious crawlers: Linux at 800px, 1900px+ or no screen.
     New test runs never reach the database at all (analytics.js skips any
     browser driven by automation). */
  function notVisitors(events, internalIds) {
    const prop = (e, k) => { const p = e.props; if (!p) return null;
      if (typeof p === "string") { try { return JSON.parse(p)[k]; } catch { return null; } } return p[k]; };
    const drop = new Set(internalIds.filter(Boolean));
    events.forEach(e => {
      if (e.event === "internal" && e.device_id) { drop.add(e.device_id); return; }
      if (e.event !== "session_start" || !e.device_id) return;
      const os = prop(e, "os"), w = +prop(e, "w") || 0, tz = String(prop(e, "tz") || "");
      const laptop = os === "Windows" && /^Asia\/(Muscat|Dubai)$/.test(tz) && [0, 390, 1280, 1440, 1536].includes(w);
      const crawler = os === "Linux" && (w === 0 || w === 800 || w >= 1900);
      if (laptop || crawler) drop.add(e.device_id);
    });
    const droppedHere = new Set(events.filter(e => drop.has(e.device_id)).map(e => e.device_id)).size;
    return { events: events.filter(e => !drop.has(e.device_id)), dropped: droppedHere };
  }

  /* ------------------------------------------------------------- crunching */
  const propOf = (e, k) => {
    const p = e.props;
    if (!p) return null;
    if (typeof p === "string") { try { return JSON.parse(p)[k]; } catch { return null; } }
    return p[k];
  };
  const dayOf = iso => localDay(iso);

  function tally(list, keyFn) {
    const m = new Map();
    list.forEach(x => {
      const k = keyFn(x);
      if (k == null || k === "") return;
      m.set(k, (m.get(k) || 0) + 1);
    });
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }

  function uniq(list, keyFn) {
    const s = new Set();
    list.forEach(x => { const k = keyFn(x); if (k) s.add(k); });
    return s.size;
  }

  /* Time zone -> country. The app records the zone the browser reports,
     never an IP, so this map is where "Asia/Muscat" becomes "Oman". Adding
     a zone here re-labels all the history at once, no data migration. */
  const TZ = {
    "Asia/Muscat":"Oman","Asia/Dubai":"UAE","Asia/Qatar":"Qatar","Asia/Bahrain":"Bahrain",
    "Asia/Kuwait":"Kuwait","Asia/Riyadh":"Saudi Arabia","Asia/Aden":"Yemen","Asia/Baghdad":"Iraq",
    "Asia/Tehran":"Iran","Asia/Amman":"Jordan","Asia/Beirut":"Lebanon","Asia/Jerusalem":"Israel",
    "Asia/Karachi":"Pakistan","Asia/Kolkata":"India","Asia/Calcutta":"India","Asia/Colombo":"Sri Lanka",
    "Asia/Dhaka":"Bangladesh","Asia/Kathmandu":"Nepal","Asia/Manila":"Philippines",
    "Asia/Jakarta":"Indonesia","Asia/Kuala_Lumpur":"Malaysia","Asia/Singapore":"Singapore",
    "Asia/Bangkok":"Thailand","Asia/Ho_Chi_Minh":"Vietnam","Asia/Hong_Kong":"Hong Kong",
    "Asia/Shanghai":"China","Asia/Tokyo":"Japan","Asia/Seoul":"South Korea","Asia/Taipei":"Taiwan",
    "Europe/London":"UK","Europe/Dublin":"Ireland","Europe/Paris":"France","Europe/Berlin":"Germany",
    "Europe/Madrid":"Spain","Europe/Rome":"Italy","Europe/Amsterdam":"Netherlands",
    "Europe/Brussels":"Belgium","Europe/Zurich":"Switzerland","Europe/Vienna":"Austria",
    "Europe/Prague":"Czechia","Europe/Warsaw":"Poland","Europe/Budapest":"Hungary",
    "Europe/Stockholm":"Sweden","Europe/Oslo":"Norway","Europe/Copenhagen":"Denmark",
    "Europe/Helsinki":"Finland","Europe/Lisbon":"Portugal","Europe/Athens":"Greece",
    "Europe/Bucharest":"Romania","Europe/Istanbul":"Turkey","Europe/Moscow":"Russia",
    "Europe/Kyiv":"Ukraine","Europe/Kiev":"Ukraine",
    "America/New_York":"USA (East)","America/Chicago":"USA (Central)","America/Denver":"USA (Mountain)",
    "America/Los_Angeles":"USA (West)","America/Phoenix":"USA (Arizona)","America/Toronto":"Canada",
    "America/Vancouver":"Canada","America/Sao_Paulo":"Brazil","America/Mexico_City":"Mexico",
    "Australia/Sydney":"Australia","Australia/Melbourne":"Australia","Australia/Perth":"Australia",
    "Australia/Brisbane":"Australia","Pacific/Auckland":"New Zealand",
    "Africa/Cairo":"Egypt","Africa/Nairobi":"Kenya","Africa/Johannesburg":"South Africa",
    "Africa/Lagos":"Nigeria","Africa/Casablanca":"Morocco","Africa/Tunis":"Tunisia",
    "Africa/Algiers":"Algeria","Africa/Addis_Ababa":"Ethiopia","Asia/Yangon":"Myanmar",
    "Asia/Almaty":"Kazakhstan","Asia/Tashkent":"Uzbekistan","Asia/Baku":"Azerbaijan",
    "Asia/Tbilisi":"Georgia","Asia/Yerevan":"Armenia","Indian/Maldives":"Maldives",
    "Asia/Phnom_Penh":"Cambodia","Asia/Vientiane":"Laos","Europe/Belgrade":"Serbia",
    "Europe/Sofia":"Bulgaria","Europe/Zagreb":"Croatia","Atlantic/Reykjavik":"Iceland"
  };
  const countryOf = tz => TZ[tz] || (tz ? tz.split("/").pop().replace(/_/g, " ") : "unknown");

  const median = arr => {
    if (!arr.length) return 0;
    const a = arr.slice().sort((x, y) => x - y);
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
  };
  const secs = ms => ms >= 60000
    ? Math.floor(ms / 60000) + "m " + Math.round((ms % 60000) / 1000) + "s"
    : Math.round(ms / 1000) + "s";

  /* ================= SESSIONS, THE INDUSTRY WAY =========================
     Both GA4 and Plausible derive a visit from the event stream rather than
     from anything the page reports: a visit starts on the first action and
     ends after 30 minutes with no action. Doing the same here means every
     one of your historic events becomes usable — visit counts, bounce rate
     and views-per-visit work on data recorded long before any of this was
     built, instead of starting from zero today.

     ENGAGED, GA4's exact test: longer than 10 seconds, OR two or more
     screen views, OR at least one key event. Bounce rate is its inverse —
     which is why "bounce" here is not "left after one page", it is "left
     without doing anything worth counting". */
  const KEY_EVENTS = new Set(["spot", "search", "maps_click", "save", "been", "plan",
    "whatsapp_click", "share", "buy_click", "product_click", "trip_intent",
    "unlock", "book_click", "insta_click", "aff_click"]);

  function sessionize(ev) {
    const byDev = new Map();
    ev.forEach(e => {
      if (!e.device_id) return;
      if (!byDev.has(e.device_id)) byDev.set(e.device_id, []);
      byDev.get(e.device_id).push(e);
    });
    const out = [];
    byDev.forEach((list, dev) => {
      list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      let cur = null;
      list.forEach(e => {
        const t = new Date(e.created_at).getTime();
        if (!cur || t - cur.last > 30 * 60000) {          // the 30-minute rule
          cur = { dev: dev, start: t, last: t, views: 0, keys: 0, n: 0,
                  entry: null, exit: null, day: dayOf(e.created_at) };
          out.push(cur);
        }
        cur.last = t; cur.n++;
        if (e.event === "view") {
          cur.views++;
          const tab = propOf(e, "tab");
          if (tab) { if (!cur.entry) cur.entry = tab; cur.exit = tab; }
        }
        if (KEY_EVENTS.has(e.event)) cur.keys++;
      });
    });
    out.forEach(s => {
      s.dur = s.last - s.start;
      s.engaged = s.dur > 10000 || s.views >= 2 || s.keys > 0;
    });
    return out;
  }

  /* Referrers grouped the way every analytics tool groups them, so "where
     traffic comes from" is four readable lines instead of forty hostnames. */
  function channelOf(host) {
    if (!host || host === "direct / app") return "Direct / messaging apps";
    if (/google|bing|duckduckgo|yahoo|yandex|baidu|ecosia/.test(host)) return "Search";
    if (/instagram|facebook|fb\.|tiktok|twitter|x\.com|t\.co|reddit|pinterest|youtube|linkedin|snapchat/.test(host)) return "Social";
    if (/whatsapp|telegram|messenger|wa\.me/.test(host)) return "Messaging";
    return "Other sites";
  }

  /* Everything the dashboard shows, derived once per load. */
  function crunch(d) {
    const ev = d.events;
    const inRange = rows => rows.filter(r => inWindow(r.created_at));
    const subs = inRange(d.subs), bookings = inRange(d.bookings), reviews = inRange(d.reviews);

    const spotEv = ev.filter(e => e.event === "spot");

    /* A PERSON vs A DEVICE THAT LOADED THE PAGE.
       Crawlers, link previewers and accidental opens all get a device_id the
       moment the page runs, so counting distinct ids counts them too — that
       is why "148" felt high. Someone who actually DID something is a person;
       someone who only fired a page view is not counted. */
    const REAL = new Set(["spot","search","maps_click","save","been","plan","type_filter",
                          "whatsapp_click","share","insta_click","aff_click","buy_click",
                          "product_click","trip_intent","unlock","view_mode","tripday",
                          "spot_time","book_click"]);
    const sess = sessionize(ev);
    const engaged = new Set();
    const allDev  = new Set();
    ev.forEach(e => { if (!e.device_id) return;
                      allDev.add(e.device_id);
                      if (REAL.has(e.event)) engaged.add(e.device_id); });
    const ctx      = ev.filter(e => e.event === "session_start");
    // One row per DEVICE (its latest reading), so "what they're on" counts
    // devices rather than re-counting the same phone on every visit.
    const ctxByDev = new Map();
    ctx.forEach(e => { if (e.device_id) ctxByDev.set(e.device_id, e); });
    const ctxDev = [...ctxByDev.values()];
    const searchEv = ev.filter(e => e.event === "search");
    const mapsEv   = ev.filter(e => e.event === "maps_click");
    const errEv    = ev.filter(e => e.event === "error");
    const dwellEv = ev.filter(e => e.event === "spot_time");
    const sessEv  = ev.filter(e => e.event === "session");
    const heldEv = ev.filter(e => e.event === "held_click" || e.event === "held_blocked");

    /* People per slot (local day, or hour of the picked day). Same test as
       the People tile: a device that did something, not one that only loaded
       the page, so the chart, the tile and the table below all agree. */
    const bySlot = new Map();
    ev.forEach(e => {
      if (!e.device_id || !REAL.has(e.event)) return;
      const k = slotOf(e.created_at);
      if (!bySlot.has(k)) bySlot.set(k, new Set());
      bySlot.get(k).add(e.device_id);
    });
    const oldest = ev.length ? ev[ev.length - 1].created_at : Date.now();
    const span = days || Math.max(1, Math.round((dayStart(today()) - dayStart(dayOf(oldest))) / 864e5) + 1);
    const series = slots(span).map(x => Object.assign(x, { n: (bySlot.get(x.key) || new Set()).size }));

    /* DAY BY DAY: one row per local day in the range, newest first. A quiet
       day stays a row of zeros, never smoothed over. Not built for a single
       picked day, where the hourly chart does that job. */
    const daily = day ? [] : series.map(x => ({ day: x.day, people: x.n, visits: 0, places: 0,
      maps: 0, emails: 0, leads: 0, reviews: 0, accounts: 0 }));
    if (daily.length) {
      const row = new Map(daily.map(r => [r.day, r]));
      const bump = (iso, f) => { const r = row.get(dayOf(iso)); if (r) r[f]++; };
      ev.forEach(e => {
        if (e.event === "spot") bump(e.created_at, "places");
        else if (e.event === "maps_click") bump(e.created_at, "maps");
      });
      sess.forEach(x => { const r = row.get(x.day); if (r) r.visits++; });
      subs.forEach(x => bump(x.created_at, "emails"));
      bookings.forEach(x => bump(x.created_at, "leads"));
      reviews.forEach(x => bump(x.created_at, "reviews"));
      (d.accounts || []).forEach(a => bump(a.created_at, "accounts"));
      daily.reverse();
    }

    return {
      dropped: d.dropped || 0,            // ours + test browsers + crawlers, not counted anywhere
      devices: engaged.size,              // the headline: people who did something
      devicesAll: allDev.size,            // everything that loaded the page
      passers: allDev.size - engaged.size,
      events: ev.length,
      views: ev.filter(e => e.event === "view").length,
      spotOpens: spotEv.length,
      subs, bookings, reviews,
      series, daily,
      tabs: tally(ev.filter(e => e.event === "view"), e => propOf(e, "tab")),
      spots: tally(spotEv, e => propOf(e, "id")),
      held: tally(heldEv, e => propOf(e, "id")),
      saves: tally(ev.filter(e => e.event === "save" && propOf(e, "on") === true), e => propOf(e, "id")),
      names: tally(ev, e => e.event),
      whatsapp: ev.filter(e => e.event === "whatsapp_click").length,
      products: tally(ev.filter(e => e.event === "product_click"), e => propOf(e, "product")),
      tripIntents: ev.filter(e => e.event === "trip_intent"),
      /* THE WELCOME SCREEN (first visit to the homepage). "welcome" is sent
         when someone leaves it, with the button; "welcome_shown" (js/
         welcome-seen.js, 17 Oct 2026) when it appears. Devices that saw it and
         never sent "welcome" left without tapping. Before 17 Oct only the taps
         exist, so "saw it" undercounts until the range is all after that. */
      welcome: (() => {
        const shownEv = ev.filter(e => e.event === "welcome_shown");
        const left = ev.filter(e => e.event === "welcome");
        const shown = new Set(shownEv.map(e => e.device_id).filter(Boolean));
        const tapped = new Set(left.map(e => e.device_id).filter(Boolean));
        const by = a => uniq(left.filter(e => (propOf(e, "action") || "dismissed") === a), e => e.device_id);
        const ofShown = a => uniq(left.filter(e => shown.has(e.device_id) && (propOf(e, "action") || "dismissed") === a), e => e.device_id);
        return { shown: shown.size, plan: by("plan"), explore: by("explore"), closed: by("dismissed"),
                 planOfShown: ofShown("plan"), exploreOfShown: ofShown("explore"), closedOfShown: ofShown("dismissed"),
                 noTap: [...shown].filter(d => !tapped.has(d)).length,
                 since: shownEv.length ? shownEv[shownEv.length - 1].created_at : null };
      })(),
      sources: tally(ev.filter(e => e.event === "trip_intent"), e => propOf(e, "source")),
      months: tally(ev.filter(e => e.event === "trip_intent"), e => propOf(e, "trip_month")),
      raw: ev.slice(0, 300),

      /* ---- accounts (null until stats-users-access.sql has been run) ---- */
      accounts: d.accounts,
      usaves: d.usaves || [],
      uvisits: d.uvisits || [],
      udevices: d.udevices || [],

      /* ---- who they are (from session_start) ---- */
      ctxCount: ctx.length,
      countries: tally(ctxDev, e => countryOf(propOf(e, "tz"))),
      zones:     tally(ctxDev, e => propOf(e, "tz")),
      kinds:     tally(ctxDev, e => propOf(e, "k")),
      oses:      tally(ctxDev, e => propOf(e, "os")),
      browsers:  tally(ctxDev, e => propOf(e, "br")),
      screens:   tally(ctxDev, e => { const w = +propOf(e, "w") || 0;
                   return !w ? "" : w < 400 ? "Small phone (<400px)"
                        : w < 500 ? "Phone (400-500px)"
                        : w < 800 ? "Large phone / small tablet"
                        : w < 1200 ? "Tablet / laptop" : "Desktop (1200px+)"; }),
      langs:     tally(ctxDev, e => propOf(e, "lang")),
      knownDevices: ctxDev.length,
      refs:      tally(ctx, e => { const r = propOf(e, "ref");
                                   if (!r) return "direct / app";
                                   try { return new URL(r).hostname; } catch { return r; } }),

      /* ---- how long they stayed ---- */
      dwellMedian: median(dwellEv.map(e => +propOf(e, "ms") || 0).filter(Boolean)),
      dwellReads: dwellEv.length,
      dwellBySpot: (() => {
        const m = new Map();
        dwellEv.forEach(e => {
          const id = propOf(e, "id"), ms = +propOf(e, "ms") || 0;
          if (!id || !ms) return;
          if (!m.has(id)) m.set(id, []);
          m.get(id).push(ms);
        });
        return [...m.entries()]
          .map(([id, list]) => [id + "  ·  " + list.length + " reads", median(list)])
          .sort((a, b) => b[1] - a[1]);
      })(),
      sessionMedian: (() => {
        const best = new Map();          // one reading per session id, the highest
        sessEv.forEach(e => {
          const sid = propOf(e, "sid"), ms = +propOf(e, "ms") || 0;
          if (!sid) return;
          best.set(sid, Math.max(best.get(sid) || 0, ms));
        });
        return median([...best.values()]);
      })(),
      sessionCount: uniq(sessEv, e => propOf(e, "sid")),
      sessionStats: (() => {
        const best = new Map();
        sessEv.forEach(e => { const sid = propOf(e, "sid"); if (!sid) return;
          best.set(sid, Math.max(best.get(sid) || 0, +propOf(e, "ms") || 0)); });
        const v = [...best.values()].filter(Boolean);
        const buckets = [["Under 30 seconds", 0], ["30s to 2 min", 0], ["2 to 5 min", 0],
                         ["5 to 15 min", 0], ["Over 15 min", 0]];
        v.forEach(ms => {
          const m = ms / 60000;
          if (ms < 30000) buckets[0][1]++;
          else if (m < 2)  buckets[1][1]++;
          else if (m < 5)  buckets[2][1]++;
          else if (m < 15) buckets[3][1]++;
          else             buckets[4][1]++;
        });
        return { buckets, mean: v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 0,
                 max: v.length ? Math.max(...v) : 0, n: v.length };
      })(),

      /* ---- what they typed, and what they didn't find ---- */
      searches: tally(searchEv, e => propOf(e, "q")),
      zeroSearches: tally(searchEv.filter(e => (+propOf(e, "n") || 0) === 0), e => propOf(e, "q")),
      searchCount: searchEv.length,

      /* ---- who actually set off driving ---- */
      maps: tally(mapsEv, e => propOf(e, "spot")),
      mapsTotal: mapsEv.length,
      mapsPeople: uniq(mapsEv, e => e.device_id),

      /* ---- which post sent them ---- */
      campaigns: tally(ctx, e => propOf(e, "camp")),
      campSrc:   tally(ctx, e => propOf(e, "src")),
      viaPage:   ctx.filter(e => propOf(e, "via") === "page").length,

      /* ---- things that broke ---- */
      errors: tally(errEv, e => propOf(e, "msg")),
      errorRows: errEv.slice(0, 40),
      errorPeople: uniq(errEv, e => e.device_id),

      /* ---- visit quality, the standard definitions ---- */
      visits: sess.length,
      engagedVisits: sess.filter(x => x.engaged).length,
      engagementRate: sess.length ? Math.round(sess.filter(x => x.engaged).length / sess.length * 100) : 0,
      bounceRate: sess.length ? Math.round((1 - sess.filter(x => x.engaged).length / sess.length) * 100) : 0,
      viewsPerVisit: sess.length
        ? Math.round(sess.reduce((a, x) => a + x.views, 0) / sess.length * 10) / 10 : 0,
      derivedDuration: median(sess.filter(x => x.dur > 0).map(x => x.dur)),
      entryTabs: tally(sess, x => x.entry),
      exitTabs:  tally(sess.filter(x => x.views > 1), x => x.exit),
      channels:  tally(ctx, e => channelOf((() => { const r = propOf(e, "ref");
                    if (!r) return "direct / app";
                    try { return new URL(r).hostname.replace(/^www\./, ""); } catch { return r; } })())),
      liveNow: uniq(ev.filter(e => Date.now() - new Date(e.created_at) < 5 * 60000), e => e.device_id),

      /* ---- the funnel, by DEVICE not by event ---- */
      funnel: [
        ["Opened the app",     uniq(ev, e => e.device_id)],
        ["Opened a spot",      uniq(spotEv, e => e.device_id)],
        ["Shared something",   uniq(ev.filter(e => e.event === "whatsapp_click" || e.event === "share"), e => e.device_id)],
        ["Gave an email",      uniq(ev.filter(e => e.event === "trip_intent"), e => e.device_id)],
        ["Clicked buy",        uniq(ev.filter(e => e.event === "buy_click" || e.event === "product_click"), e => e.device_id)],
        ["Unlocked",           uniq(ev.filter(e => e.event === "unlock"), e => e.device_id)]
      ]
    };
  }

  /* ------------------------------------------------------------- rendering */
  function tile(k, v, s, cls) {
    return `<div class="tile ${cls || ""}"><div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div><div class="s">${esc(s || "")}</div></div>`;
  }

  function barTable(rows, head, opts) {
    opts = opts || {};
    if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
    const max = Math.max(1, ...rows.map(r => r[1] || 0));
    const body = rows.slice(0, opts.limit || 25).map(([k, n]) => `
      <tr><td class="bar-cell"><i style="width:${(n / max * 100).toFixed(1)}%"></i>
        <span>${esc(opts.label ? opts.label(k) : k)}</span></td>
      <td class="num">${nf(n)}</td></tr>`).join("");
    return `<div class="tblwrap"><table><thead><tr>
      <th>${esc(head[0])}</th><th class="num">${esc(head[1])}</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function dataTable(rows, cols) {
    if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
    const head = cols.map(c => `<th>${esc(c.h)}</th>`).join("");
    const body = rows.map(r => "<tr>" + cols.map(c =>
      `<td class="${c.cls || ""}">${c.get(r)}</td>`).join("") + "</tr>").join("");
    return `<div class="tblwrap"><table><thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }

  const fmtDate = iso => {
    const d = new Date(iso);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" })
      + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  };

  /* One series, so no legend — the heading names it. Gridlines are hairlines
     behind the marks; the peak is direct-labelled by colour AND named in the
     axis, never colour alone. Every bar carries a hover tooltip. */
  function chart(series) {
    if (!series.length) return `<div class="panel"><div class="empty">No days yet.</div></div>`;
    const max = Math.max(1, ...series.map(s => s.n));
    const nice = max <= 4 ? max : Math.ceil(max / 4) * 4;
    // Small counts (an hour, a quiet day) get one line per whole number;
    // quarters of 1 or 3 rounded to "0, 1, 1, 1".
    const steps = nice < 4 ? Array.from({ length: nice }, (_, i) => (i + 1) / nice) : [0.25, 0.5, 0.75, 1];
    const lines = steps.map(f =>
      `<i style="bottom:${f * 100}%"></i><b style="bottom:${f * 100}%">${Math.round(nice * f)}</b>`).join("");
    const lab = s => s.label || dayLabelOf(s.day);
    const bars = series.map(s =>
      `<div class="b${s.n === max && max > 0 ? " peak" : ""}"
            style="height:${Math.max(2, s.n / nice * 100)}%">
        <span>${esc(lab(s))} — <b>${nf(s.n)}</b> ${s.n === 1 ? "person" : "people"}</span>
       </div>`).join("");
    return `<div class="panel"><div class="chartwrap">
      <div class="grid">${lines}</div>
      <div class="bars">${bars}</div>
      <div class="axis"><span>${esc(lab(series[0]))}</span>
        <span>peak ${nf(max)} ${series[0].hour != null ? "at" : "on"} ${esc(lab(series.find(x => x.n === max) || series[0]))}</span>
        <span>${esc(lab(series[series.length - 1]))}</span></div>
    </div></div>`;
  }

  const csv = (rows, cols, name) => {
    const line = a => a.map(v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(",");
    const body = [line(cols.map(c => c.h))]
      .concat(rows.map(r => line(cols.map(c => c.raw(r))))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "text/csv;charset=utf-8" }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  const z = n => n ? nf(n) : `<span class="zero">0</span>`;
  function dailyCols(c) {
    const col = (h, f) => ({ h, get: r => z(r[f]), cls: "num", raw: r => r[f] });
    return [
      { h: "Day", get: r => `<button class="daylink" data-day="${esc(r.day)}">${esc(dayLabelOf(r.day))}</button>`,
        raw: r => r.day },
      col("People", "people"), col("Visits", "visits"), col("Places opened", "places"),
      col("Took directions", "maps"), col("Emails", "emails"), col("Leads", "leads"),
      col("Reviews", "reviews")
    ].concat(c.accounts ? [col("New accounts", "accounts")] : []);
  }

  const TABS = [
    ["overview", "Overview", d => ""],
    ["people",   "People",   d => d.ctxCount],
    ["users",    "Accounts", d => d.accounts ? d.accounts.length : ""],
    ["places",   "Places",   d => d.spots.length],
    ["locked",   "Locked interest", d => d.held.length],
    ["emails",   "Emails",   d => d.subs.length],
    ["leads",    "Leads",    d => d.bookings.length],
    ["reviews",  "Reviews",  d => d.reviews.length],
    ["events",   "Raw events", d => d.events]
  ];

  function renderTabs(c) {
    $("#tabs").innerHTML = TABS.map(([id, label, n]) => {
      const v = n(c);
      return `<button data-t="${id}" class="${tab === id ? "on" : ""}">${esc(label)}
        ${v ? `<span class="n">${nf(v)}</span>` : ""}</button>`;
    }).join("");
    [...$("#tabs").children].forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  }

  function draw() {
    const c = DATA;
    renderTabs(c);
    const v = $("#view");
    const rangeLabel = day
      ? (day === today() ? "today" : day === addDays(today(), -1) ? "yesterday" : dayLabelOf(day))
      : days ? "last " + days + " days" : "all time";

    if (tab === "overview") {
      v.innerHTML = `
        <h2 class="sec">The numbers, ${esc(rangeLabel)}</h2>
        <div class="tiles">
          ${tile("People", nf(c.devices), "unique visitors who did something", "teal")}
          ${tile("Visits", nf(c.visits), "sessions, 30-min rule", "teal")}
          ${tile("Engagement rate", c.engagementRate + "%",
                 "bounce rate " + c.bounceRate + "%", "gold")}
          ${tile("Typical visit", c.derivedDuration ? secs(c.derivedDuration) : "—",
                 c.sessionMedian ? "measured: " + secs(c.sessionMedian) : "from event gaps", "gold")}
          ${tile("Views per visit", c.viewsPerVisit, "screens opened per session")}
          ${tile("Places opened", nf(c.spotOpens), "spot sheets")}
          ${tile("Took directions", nf(c.mapsTotal || 0), "tapped Google Maps")}
          ${tile("Emails", nf(c.subs.length), "on the list")}
        </div>
        ${(() => { const w = c.welcome, pc = n => w.shown ? " · " + Math.round(n / w.shown * 100) + "% of those who saw it" : "";
          return `<h2 class="sec">Welcome screen (first visit to the homepage)</h2>
        <div class="tiles">
          ${tile("Saw it", w.shown ? nf(w.shown) : "—", w.since ? "counted since " + fmtDate(w.since) : "counting starts with the next visitor", "teal")}
          ${tile("I'm planning a trip", w.shown ? nf(w.planOfShown) : "—", w.shown ? "tapped it" + pc(w.planOfShown) : "", "teal")}
          ${tile("Just show me the places", w.shown ? nf(w.exploreOfShown) : "—", w.shown ? "tapped it" + pc(w.exploreOfShown) : "")}
          ${tile("Left without tapping", w.shown ? nf(w.noTap) : "—", w.shown ? "saw it, never tapped" + pc(w.noTap) : "needs a few days of 'saw it'", "gold")}
        </div>
        <div class="note">All four boxes count the same people: everyone who saw the screen since it started being
          counted${w.since ? " (" + fmtDate(w.since) + ")" : ""}, so they add up to "Saw it"${w.closedOfShown ? ` (${nf(w.closedOfShown)} closed it another way)` : ""}.
          People landing on a place or Info link never see this screen, and nor does anyone who has seen it before.
          ${(w.plan - w.planOfShown) || (w.explore - w.exploreOfShown) ? `<br>Older taps, from before "saw it" was counted (so no "left" number exists for them),
          in this date range: <b>${nf(w.plan - w.planOfShown)}</b> "I'm planning a trip" · <b>${nf(w.explore - w.exploreOfShown)}</b> "Just show me the places".` : ""}</div>`; })()}
        ${c.dropped ? `<div class="note"><b>${nf(c.dropped)}</b> device${c.dropped === 1 ? "" : "s"} not counted anywhere on
          this page: Ali's laptop and the test browsers on it, devices marked with
          <code>?me=on</code> (open <b>exploresoman.com/?me=on</b> once on a phone to stop counting it), and crawlers.</div>` : ""}
        ${c.liveNow ? `<div class="note" style="border-left-color:var(--good)">
          <b>${nf(c.liveNow)}</b> ${c.liveNow === 1 ? "person is" : "people are"} on the site right now.</div>` : ""}
        <div class="note">
          <b>Engagement rate</b> uses Google Analytics' own test: a visit counts as engaged if it
          lasted over 10 seconds, opened 2+ screens, or included a real action. Bounce rate is
          simply its inverse — not "left after one page", but "left without doing anything".
          Visits are cut the way Plausible and GA4 cut them: a new visit begins after 30 minutes
          of no activity, worked out from your event history, so these numbers cover all your
          data and not just since the last deploy.
        </div>
        <div class="note">
          <b>${nf(c.devices)} people</b> is devices that actually did something — opened a
          place, searched, tapped Maps. A further <b>${nf(c.passers)}</b> device${c.passers === 1 ? "" : "s"}
          loaded the page and did nothing at all; those are mostly crawlers and link previews,
          and they are excluded from every number above.
        </div>
        <h2 class="sec">Traffic — people per ${day ? "hour" : "day"}</h2>
        ${chart(c.series)}
        ${c.daily.length ? `<h2 class="sec">Day by day
          <button class="ghost" id="expDaily" style="margin-left:auto">Export CSV</button></h2>
        <div class="panel">${dataTable(c.daily, dailyCols(c))}</div>
        <div class="note">Tap a day to see the whole dashboard for just that day.
          <b>People</b> uses the same test as the People tile, so someone who comes back on two
          days counts once on each. Days run midnight to midnight on this computer's clock.</div>` : ""}
        <h2 class="sec">How long a visit lasts</h2>
        <div class="panel">${barTable(c.sessionStats ? c.sessionStats.buckets : [], ["Length of visit", "Visits"])}</div>
        ${c.sessionStats && c.sessionStats.n ? `<div class="note">
          Longest visit so far: <b>${secs(c.sessionStats.max)}</b>. Idle time is not counted —
          the clock stops when the page is hidden or untouched for a minute, so these are
          minutes of actual attention.</div>` : `<div class="note">
          Visit timing starts collecting from the build you deploy next.</div>`}
        <h2 class="sec">Where they go</h2>
        <div class="panel">${barTable(c.tabs, ["Screen", "Views"])}</div>
        <h2 class="sec">Where visits start and end</h2>
        <div class="panel">${barTable(c.entryTabs, ["Landed on", "Visits"])}</div>
        <div class="panel">${barTable(c.exitTabs, ["Last screen before leaving", "Visits"])}</div>
        <div class="note">Entry tells you what the front door is doing. Exit tells you where
          people give up — a screen high on both lists is usually the problem one.</div>
        ${c.errors.length ? `<h2 class="sec">⚠ Errors — the app broke for someone</h2>
        <div class="panel">${barTable(c.errors, ["Error", "Times"], { limit: 10 })}</div>
        <div class="panel"><div class="k" style="font-size:11.5px;color:var(--muted)">
          Hit ${nf(c.errorPeople)} ${c.errorPeople === 1 ? "person" : "people"}.
          A syntax slip in content.js shows up here first.</div></div>` : ""}
        <h2 class="sec">Where they drop off</h2>
        <div class="panel">${barTable(c.funnel, ["Step (people, not clicks)", "People"])}</div>
        <h2 class="sec">Every tracked action</h2>
        <div class="panel">${barTable(c.names, ["Event", "Times"], { limit: 40 })}</div>`;
      v.querySelectorAll("[data-day]").forEach(b => b.onclick = () => setDay(b.dataset.day));
      const exp = $("#expDaily");
      if (exp) exp.onclick = () => csv(c.daily, dailyCols(c), "exploring-oman-by-day.csv");
      return;
    }

    if (tab === "people") {
      const note = c.ctxCount
        ? ""
        : `<div class="empty">Nothing yet — this only fills up from visits AFTER
             the build that added device and time-zone collection. Give it a day.</div>`;
      v.innerHTML = `
        <h2 class="sec">Where they are, ${esc(rangeLabel)} <span class="pill">counted per device</span></h2>
        ${note}
        <div class="panel">${barTable(c.countries, ["Country (from time zone)", "Visits"], { limit: 30 })}</div>
        <h2 class="sec">What they are on <span class="pill">${nf(c.knownDevices)} devices</span></h2>
        <div class="panel">${barTable(c.kinds, ["Device type", "Devices"])}</div>
        <div class="panel">${barTable(c.screens, ["Screen size", "Devices"])}</div>
        <div class="panel">${barTable(c.oses, ["Operating system", "Devices"])}</div>
        <div class="panel">${barTable(c.browsers, ["Browser", "Devices"])}</div>
        <h2 class="sec">Language</h2>
        <div class="panel">${barTable(c.langs, ["Browser language", "Visits"], { limit: 15 })}</div>
        <h2 class="sec">Which post sent them (?r= on your links)</h2>
        <div class="panel">${barTable(c.campaigns, ["Campaign tag", "Visits"], { limit: 20 })}</div>
        <div class="panel">${barTable(c.campSrc, ["utm_source", "Visits"], { limit: 20 })}</div>
        <div class="panel" style="display:flex;gap:10px;flex-wrap:wrap">
          ${tile("Arrived via a shared page", nf(c.viaPage), "landed on an s/ or p/ page")}
        </div>
        <h2 class="sec">Traffic channels</h2>
        <div class="panel">${barTable(c.channels, ["Channel", "Visits"])}</div>
        <div class="note">Messaging apps and typed URLs both arrive with no referrer, so they
          land in Direct — that is where most WhatsApp shares show up. It is the standard
          limitation everywhere, which is why the <b>?r=</b> tags matter.</div>
        <h2 class="sec">How they got here</h2>
        <div class="panel">${barTable(c.refs, ["Came from", "Visits"], { limit: 15 })}</div>
        <h2 class="sec">Exact time zones</h2>
        <div class="panel">${barTable(c.zones, ["Time zone", "Visits"], { limit: 30 })}</div>`;
      return;
    }

    if (tab === "users") {
      /* -------------------------------------------------- registered users
         Everything on this tab is ACCOUNTS, not devices: people who signed
         up, what they hoard (♥) and what they've actually done (✓). */
      if (!c.accounts) {
        v.innerHTML = `
          <h2 class="sec">Accounts</h2>
          <div class="note"><b>One-time setup:</b> run
          <code>delivery/stats-users-access.sql</code> in Supabase → SQL Editor
          (after <code>accounts-schema.sql</code>), then reload this page.
          Until then the dashboard has no permission to read the accounts.</div>`;
        return;
      }
      const acc = c.accounts;
      const banned = r => r.banned_until && new Date(r.banned_until) > new Date();
      const devByUser = new Map();
      c.udevices.forEach(dv => {
        const cur = devByUser.get(dv.user_id);
        if (!cur || new Date(dv.last_seen) > new Date(cur.last_seen)) devByUser.set(dv.user_id, dv);
      });
      // "From": what they DECLARED at signup wins; the device time zone fills in.
      const whereOf = r => {
        if (r.country) return r.country;
        const dv = devByUser.get(r.id);
        return dv ? countryOf(dv.tz) : "—";
      };
      const wireUops = scope => scope.querySelectorAll("button[data-uop]").forEach(btn => btn.onclick = async () => {
        const { uop, uid, uemail } = btn.dataset;
        if (uop === "del" &&
            !confirm("Delete " + (uemail || "this user") + " permanently?\n\nTheir profile, saves and been-theres go too. Cannot be undone.")) return;
        btn.disabled = true;
        try {
          if (uop === "del") {
            await rpc("dashboard_delete_user", { uid });
            const i = acc.findIndex(x => x.id === uid);
            if (i > -1) acc.splice(i, 1);
            if (userDetail === uid) userDetail = null;
            toast("Account deleted.");
          } else {
            await rpc("dashboard_ban_user", { uid, ban: uop === "ban" });
            const row = acc.find(x => x.id === uid);
            if (row) row.banned_until = uop === "ban" ? "3000-01-01T00:00:00Z" : null;
            toast(uop === "ban" ? "Banned — they can no longer sign in." : "Unbanned.");
          }
          draw();
        } catch (e) {
          btn.disabled = false;
          toast("Could not do that: " + String(e.message || e).slice(0, 120), true);
        }
      });

      /* ================= one user's page ================= */
      if (userDetail) {
        const u = acc.find(x => x.id === userDetail);
        if (!u) { userDetail = null; draw(); return; }
        const devs = c.udevices.filter(d => d.user_id === u.id);
        const saves = c.usaves.filter(x => x.user_id === u.id);
        const visits = c.uvisits.filter(x => x.user_id === u.id);
        const urevs = c.reviews.filter(r => r.user_id === u.id);
        const stars = n => n ? "★".repeat(n) + "☆".repeat(5 - n) : "—";
        const idList = rows => rows.length
          ? `<div class="tblwrap"><table><tbody>` + rows.map(x =>
              `<tr><td>${esc(x.spot_id)}</td><td class="num">${esc(fmtDate(x.created_at || ""))}</td></tr>`).join("") +
            `</tbody></table></div>`
          : `<div class="empty">Nothing yet.</div>`;
        v.innerHTML = `
          <p><button class="ghost" id="uBack">‹ All accounts</button></p>
          <h2 class="sec">${esc(u.name || u.email || "Account")}
            ${banned(u) ? `<span class="pill down">banned</span>` : `<span class="pill up">active</span>`}</h2>
          <div class="tiles">
            ${tile("Email", u.email || "—", "")}
            ${tile("From", u.country || "—", devs.length ? "device says " + esc(countryOf((devByUser.get(u.id)||{}).tz)) : "no device seen yet")}
            ${tile("Joined", fmtDate(u.created_at), u.confirmed_at ? "confirmed " + fmtDate(u.confirmed_at) : "NOT confirmed")}
            ${tile("Last seen", u.last_sign_in ? fmtDate(u.last_sign_in) : "—", "")}
            ${tile("♥ / ✓ / ⭐", nf(u.saves) + " / " + nf(u.visits) + " / " + nf(u.reviews), "saves / been / reviews")}
          </div>
          <p>
            ${banned(u)
              ? `<button class="act" data-uop="unban" data-uid="${esc(u.id)}">Unban</button>`
              : `<button class="act" data-uop="ban" data-uid="${esc(u.id)}">Ban</button>`}
            <button class="act bad" data-uop="del" data-uid="${esc(u.id)}" data-uemail="${esc(u.email || "")}">Delete account</button>
          </p>
          <h2 class="sec">Devices <span class="pill">${nf(devs.length)}</span></h2>
          <div class="panel">${devs.length ? `<div class="tblwrap"><table><thead><tr>
              <th>Where</th><th>Device</th><th>Browser</th><th class="num">Last seen</th></tr></thead><tbody>` +
            devs.map(d => `<tr><td>${esc(countryOf(d.tz))}</td><td>${esc([d.kind, d.os].filter(Boolean).join(" · ") || "—")}</td>
              <td>${esc(d.browser || "—")}</td><td class="num">${esc(fmtDate(d.last_seen))}</td></tr>`).join("") +
            `</tbody></table></div>` : `<div class="empty">No signed-in visit recorded yet.</div>`}</div>
          <h2 class="sec">♥ Saved <span class="pill">${nf(saves.length)}</span></h2>
          <div class="panel">${idList(saves)}</div>
          <h2 class="sec">✓ Been there <span class="pill">${nf(visits.length)}</span></h2>
          <div class="panel">${idList(visits)}</div>
          <h2 class="sec">⭐ Their reviews <span class="pill">${nf(urevs.length)}</span></h2>
          <div class="panel">${urevs.length ? `<div class="tblwrap"><table><thead><tr>
              <th>When</th><th>Place</th><th>Stars</th><th>What they wrote</th><th>Live</th><th>Action</th></tr></thead><tbody>` +
            urevs.map(r => `<tr><td>${esc(fmtDate(r.created_at))}</td><td>${esc(r.spot || "—")}</td>
              <td><span class="stars">${stars(r.stars)}</span></td><td class="wrap">${esc(r.tip || "—")}</td>
              <td>${r.published ? `<span class="pill up">live</span>` : `<span class="pill down">hidden</span>`}</td>
              <td>${r.published
                  ? `<button class="act" data-table="reviews" data-id="${esc(r.id)}" data-field="published" data-value="false">Hide</button>`
                  : `<button class="act go" data-table="reviews" data-id="${esc(r.id)}" data-field="published" data-value="true">Publish</button>`}
                <button class="act bad" data-table="reviews" data-id="${esc(r.id)}" data-del="1">Delete</button></td></tr>`).join("") +
            `</tbody></table></div>` : `<div class="empty">No reviews yet.</div>`}</div>`;
        $("#uBack").onclick = () => { userDetail = null; draw(); };
        wireUops(v);
        wireActions(v);
        return;
      }

      const accNew = acc.filter(a => inWindow(a.created_at));
      const confirmed = acc.filter(a => a.confirmed_at).length;
      const active = acc.filter(a => a.last_sign_in && inWindow(a.last_sign_in)).length;
      // signups per day, same series shape the traffic chart eats
      const sBySlot = new Map();
      acc.filter(a => !day || inWindow(a.created_at)).forEach(a => {
        const k = slotOf(a.created_at); sBySlot.set(k, (sBySlot.get(k) || 0) + 1); });
      const signupSeries = slots(days || 30).map(x => Object.assign(x, { n: sBySlot.get(x.key) || 0 }));
      const cols = [
        { h: "Name",       get: r => `<button class="act go" data-uview="${esc(r.id)}">${esc(r.name || r.email || "—")}</button>`, raw: r => r.name || "" },
        { h: "Email",      get: r => `<span class="mono">${esc(r.email || "")}</span>`, raw: r => r.email || "" },
        { h: "Joined",     get: r => fmtDate(r.created_at), raw: r => r.created_at },
        { h: "Confirmed",  get: r => r.confirmed_at ? "✓" : `<span style="color:var(--warn)">not yet</span>`, raw: r => r.confirmed_at ? "yes" : "no" },
        { h: "Last seen",  get: r => r.last_sign_in ? fmtDate(r.last_sign_in) : "—", raw: r => r.last_sign_in || "" },
        { h: "From",       get: r => esc(whereOf(r)), raw: r => whereOf(r) },
        { h: "♥",          get: r => nf(r.saves), cls: "num", raw: r => r.saves },
        { h: "✓",          get: r => nf(r.visits), cls: "num", raw: r => r.visits },
        { h: "Reviews",    get: r => nf(r.reviews), cls: "num", raw: r => r.reviews },
        { h: "Status",     get: r => banned(r)
            ? `<span class="pill down">banned</span>` : `<span class="pill up">active</span>`,
          raw: r => banned(r) ? "banned" : "active" },
        { h: "Action",     get: r => {
            const ban = banned(r)
              ? `<button class="act" data-uop="unban" data-uid="${esc(r.id)}">Unban</button>`
              : `<button class="act" data-uop="ban" data-uid="${esc(r.id)}">Ban</button>`;
            return ban + `<button class="act bad" data-uop="del" data-uid="${esc(r.id)}"
