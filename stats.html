<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff">
<title>Exploring Oman — Stats</title>

<!--
  ===========================================================================
  THE STATS DESK.  exploresoman.com/stats.html
  ---------------------------------------------------------------------------
  WHO CAN SEE THIS DATA
  Nobody, until they sign in. The publishable key below is the same one the
  public app already ships, and on its own it can only INSERT (see
  delivery/backend-schema.sql). Reading needs a Supabase Auth session, which
  needs an email and password you created by hand.

  SETUP, ONCE (5 minutes):
    1. Open delivery/dashboard-access.sql, put YOUR TWO EMAILS in step 1 of
       it, then run the whole file in Supabase -> SQL Editor.
       Reading is allow-listed to those addresses, because this project had
       public sign-ups switched on and the key below is public: without the
       allow-list, a stranger could sign up and read the email list.
    2. Authentication -> Sign In / Providers -> Email -> turn OFF "Allow new
       users to sign up". (Belt and braces, do it anyway.)
    3. Authentication -> Users -> "Add user" -> one for each of you, using
       the same two addresses, tick "Auto Confirm User".
    4. Open exploresoman.com/stats.html and sign in.

  WHY NO LIBRARY: the whole project has no build step and no dependencies.
  Supabase Auth and PostgREST are both plain HTTP, so this page is one file
  of vanilla JS that will still run in five years.

  WHAT IT CANNOT DO: there is no UPDATE or DELETE policy for a signed-in
  user, so nothing on this page can change or destroy a row. It reads.
  ===========================================================================
-->

<style>
/* =============================================================================
   THE LOOK (19 Oct 2026): Google Search Console's. White panels on a light
   grey page, one blue for the chrome, and four fixed series colours that
   belong to the four numbers on Performance (People / Visits / Opened a
   place / Reached out) and to nothing else.
   ========================================================================== */
:root{
  --bg:#f8f9fa; --panel:#ffffff; --panel-2:#f1f3f4;
  --line:#dadce0; --line-soft:#e8eaed;
  --ink:#202124; --ink-2:#3c4043; --muted:#5f6368;

  --s1:#4285f4; --s2:#5e35b1; --s3:#00897b; --s4:#e8710a;
  --good:#1e8e3e; --warn:#f29900; --bad:#d93025;

  --brand:#1a73e8;                 /* UI chrome only, never a data mark */
  --radius:8px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* ---------------------------------------------------------------- sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate form{width:100%;max-width:380px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:30px 28px}
.gate h1{margin:0 0 4px;font-size:22px;font-weight:500}
.gate p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.gate label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 6px}
.gate input{width:100%;margin:0 0 14px;padding:11px 13px;border-radius:4px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit}
.gate input:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.btn{width:100%;padding:11px;border:0;border-radius:4px;background:var(--brand);
  color:#fff;font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.err{margin:12px 0 0;color:var(--bad);font-size:13px;min-height:1.2em}

/* ------------------------------------------------------------------- head */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hrow{max-width:1180px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:500;font-size:17px;margin-right:auto;color:var(--ink)}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.range{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:999px;
  overflow-x:auto;scrollbar-width:none;max-width:100%}
.range::-webkit-scrollbar{display:none}
.range button{flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);font-size:12.5px;
  font-weight:500;padding:6px 12px;border-radius:999px;white-space:nowrap}
.range button:hover{color:var(--ink)}
.range button.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 2px rgba(60,64,67,.3)}
.daynav{display:flex;align-items:center;gap:4px}
.daynav .ghost{padding:6px 11px;font-size:14px;line-height:1}
.daynav .ghost:disabled{opacity:.35;cursor:default}
.daynav input{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:500}
.daynav input.on{border-color:var(--brand);color:var(--brand)}
.rgto{font-size:12.5px;color:var(--muted)}
.daylink{border:0;background:none;padding:0;font:inherit;font-weight:500;color:var(--ink);
  cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.daylink:hover{color:var(--brand);text-decoration-color:var(--brand)}
.zero{color:var(--muted);opacity:.6}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:500}
.ghost:hover{color:var(--brand);border-color:var(--brand);background:#f8fbff}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;
  overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;
  color:var(--muted);padding:10px 14px 9px;font-size:13.5px;font-weight:500}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
nav.tabs .n{font-size:11.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;
  background:var(--panel-2);border-radius:999px;padding:1px 7px}
nav.tabs button.on .n{background:#e8f0fe;color:var(--brand)}

/* --------------------------------------------------------------- sections */
h2.sec{font-size:16px;color:var(--ink);margin:28px 0 12px;font-weight:500;
  display:flex;align-items:center;gap:9px}
h2.sec .pill{text-transform:none;letter-spacing:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

/* ------------------------------------------------------------------ tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-size:28px;font-weight:400;margin:6px 0 2px;line-height:1.1;color:var(--ink)}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile.teal{border-top:3px solid var(--s1)}
.tile.gold{border-top:3px solid var(--s4)}
.tile.pink{border-top:3px solid var(--s3)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;overflow:hidden}
.note{color:var(--ink-2);font-size:13px;line-height:1.6;margin:12px 0 0;
  padding:11px 14px;background:#f8fbff;border:1px solid #d2e3fc;border-radius:8px}
.note b{color:var(--ink)}

/* ------------------------------------------------- bar chart (Accounts tab) */
.chartwrap{position:relative;padding:4px 0 0}
.grid{position:absolute;inset:0 0 26px 0;pointer-events:none}
.grid i{position:absolute;left:0;right:0;height:1px;background:var(--line-soft)}
.grid b{position:absolute;left:0;transform:translateY(-50%);font-size:11px;
  color:var(--muted);font-weight:400;background:var(--panel);padding:0 4px;
  font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;position:relative}
.bars .b{flex:1 1 0;min-width:2px;background:var(--s1);border-radius:3px 3px 0 0;
  position:relative;transition:filter .12s}
.bars .b:hover{filter:brightness(1.1)}
.bars .b.peak{background:var(--s2)}
.bars .b span{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:5px 9px;font-size:12px;color:var(--ink);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .1s;z-index:5;
  font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(60,64,67,.2)}
.bars .b:hover span{opacity:1}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;
  margin-top:9px;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ table */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:-16px;padding:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line-soft);
  vertical-align:middle;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:240px}
tbody tr:hover{background:#f8f9fa}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{color:var(--ink)}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:5px;bottom:5px;
  background:#e8f0fe;border-radius:0 4px 4px 0}
.bar-cell span{position:relative;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;
  font-weight:500;background:var(--panel-2);color:var(--muted);border:1px solid var(--line-soft)}
.pill.up{background:#e6f4ea;color:#137333;border-color:transparent}
.pill.down{background:#fce8e6;color:#c5221f;border-color:transparent}
.stars{color:#f29900;letter-spacing:1px}
/* ----------------------------------------------------------------- actions */
.act{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  padding:5px 11px;border-radius:4px;font-size:12.5px;font-weight:500;
  margin:0 5px 0 0;white-space:nowrap}
.act:hover:not(:disabled){color:var(--brand);border-color:var(--brand)}
.act.go{background:var(--brand);border-color:var(--brand);color:#fff}
.act.go:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
.act.bad{color:var(--bad)}
.act.bad:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.act:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);
  background:#323232;color:#fff;
  padding:11px 20px;border-radius:4px;font-size:13.5px;font-weight:500;
  box-shadow:0 3px 12px rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .16s ease,transform .16s ease;z-index:60;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.empty{color:var(--muted);padding:28px 4px;text-align:center;font-size:13.5px}
.hide{display:none !important}

/* ============================================================ PERFORMANCE */
.pf-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}
.pf-top h1{font-size:24px;font-weight:400;margin:0;color:var(--ink)}
.pf-top .upd{font-size:12.5px;color:var(--muted);margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(30,142,62,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);
  border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;color:var(--ink-2)}
.chip b{font-weight:500;color:var(--ink)}
.chip.date{padding-right:12px;border-color:#d2e3fc;background:#e8f0fe;color:#174ea6}
.chip.date b{color:#174ea6}
.chip button{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:50%;
  font-size:16px;line-height:1;display:grid;place-items:center}
.chip button:hover{background:var(--panel-2);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);
  border-radius:8px 8px 0 0;overflow:hidden;background:var(--panel)}
.card{appearance:none;border:0;border-right:1px solid var(--line);background:var(--panel);text-align:left;
  padding:14px 16px 12px;min-width:0;color:var(--ink);transition:background .12s}
.card:last-child{border-right:0}
.card:hover{background:#f8f9fa}
.card .lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.card .ck{width:16px;height:16px;border:2px solid #80868b;border-radius:2px;flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;line-height:1;font-weight:900}
.card .v{display:block;font-size:32px;font-weight:400;margin:8px 0 2px;font-variant-numeric:tabular-nums;line-height:1.1}
.card .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .d.up{color:var(--good)}
.card .d.down{color:var(--bad)}
.card.on{background:var(--c)}
.card.on:hover{background:var(--c);filter:brightness(1.04)}
.card.on .lbl,.card.on .v,.card.on .d{color:#fff}
.card.on .ck{border-color:#fff;background:#fff;color:var(--c)}
.card.on .ck::after{content:"\2713"}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:-3px}
.chartp{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--panel);
  padding:14px 8px 8px;position:relative;min-height:230px}
.chartp svg{display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(60,64,67,.22);border-radius:6px;padding:8px 11px;font-size:12.5px;
  white-space:nowrap;z-index:5;display:none}
.tip .t{font-weight:500;margin:0 0 4px;color:var(--ink)}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tip .r i{width:9px;height:9px;border-radius:50%}
.tip .r b{margin-left:auto;padding-left:14px;font-weight:500;color:var(--ink)}
.dimp{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.dtabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:0 0 auto;border:0;background:none;padding:15px 18px 12px;font-size:12.5px;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.dtabs button:hover{color:var(--ink);background:#f8f9fa}
.dtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.dtbl{overflow-x:auto}
.dtbl th{cursor:pointer;user-select:none;padding:12px 16px}
.dtbl th:hover{color:var(--ink)}
.dtbl th.sorted{color:var(--ink)}
.dtbl th .ar{font-size:11px;margin-left:3px}
.dtbl td{padding:12px 16px}
.dtbl td.nm{white-space:normal;min-width:150px;color:var(--ink)}
.dtbl tbody tr{cursor:pointer}
.dtbl tbody tr:hover td{background:#f1f3f4}
.dtbl td.nm .sub{display:block;font-size:12px;color:var(--muted)}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px 12px;font-size:12.5px;
  color:var(--muted);border-top:1px solid var(--line-soft)}
.pager button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--ink-2)}
.pager button:hover:not(:disabled){background:var(--panel-2)}
.pager button:disabled{opacity:.3;cursor:default}
.pager .ex{margin-right:auto;color:var(--brand);font-weight:500;font-size:12.5px;
  width:auto;height:auto;border-radius:4px;padding:6px 8px;letter-spacing:.04em;text-transform:uppercase}
.pager .ex:hover{background:#f8fbff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.box{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px 18px;min-width:0}
.box h3{margin:0 0 2px;font-size:15px;font-weight:500;color:var(--ink)}
.box .bs{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.box.warn{border-color:#f9dedc;background:#fffbfa}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline;font-size:13.5px;margin:0 0 11px}
.hb .l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .n{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}
.hb .n small{color:var(--muted);font-weight:400;margin-left:6px}
.hb .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--brand))}
.hb .pill{margin-left:6px;font-size:11px;padding:0 7px}
.wel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.wel div{background:var(--bg);border-radius:6px;padding:10px 12px}
.wel b{display:block;font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.wel span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.card .d em{font-style:normal}
.cmpnote{display:none;font-size:12px;color:var(--muted);padding:6px 2px 0}
.dtbl th .sm{display:none}
.howto{font-size:12.5px;color:var(--muted);line-height:1.65;margin:20px 2px 0;max-width:880px}
.howto b{color:var(--ink-2);font-weight:500}
@media(max-width:760px){
  .wrap{padding:0 12px 60px}
  .hrow{padding:8px 12px;gap:8px}
  nav.tabs{padding:0 6px}
  .brand{width:100%;margin-right:0}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{border-bottom:1px solid var(--line);padding:12px 12px 10px}
  .card:nth-child(2n){border-right:0}
  .card:nth-child(n+3){border-bottom:0}
  .card .v{font-size:26px}
  .card .d em{display:none}
  .cmpnote{display:block;order:2}
  .dtbl th .lg{display:none}
  .dtbl th .sm{display:inline}
  .dtbl th,.dtbl td{padding:11px 8px}
  .dtbl td.nm{min-width:96px}
  .grid2{grid-template-columns:1fr}
  .wel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dtabs button{padding:13px 13px 11px}
  .tile .v{font-size:24px}
  .bars{height:120px}
}
</style>
</head>
<body>

<!-- ------------------------------------------------------------- sign in -->
<div class="gate" id="gate">
  <form id="loginForm" autocomplete="on">
    <h1>Exploring Oman</h1>
    <p>Stats desk. Sign in with the account made for you in Supabase.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- ------------------------------------------------------------ dashboard -->
<div id="app" class="hide">
  <header>
    <div class="hrow">
      <div class="brand">Exploring Oman · Stats <small id="who">dashboard</small></div>
      <div class="range" id="range">
        <button data-day="0">Today</button>
        <button data-day="-1">Yesterday</button>
        <button data-d="1">24 hours</button>
        <button data-d="7">7 days</button>
        <button data-d="28" class="on">28 days</button>
        <button data-d="90">3 months</button>
        <button data-d="0">All time</button>
      </div>
      <div class="daynav">
        <button class="ghost" id="dayPrev" aria-label="Previous day" title="Previous day">‹</button>
        <input type="date" id="dayPick" aria-label="Show one day" title="Show one day">
        <button class="ghost" id="dayNext" aria-label="Next day" title="Next day">›</button>
      </div>
      <div class="daynav">
        <input type="date" id="rgFrom" aria-label="From" title="From this day">
        <span class="rgto">to</span>
        <input type="date" id="rgTo" aria-label="To" title="To this day">
      </div>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="out">Sign out</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="wrap" id="view"></div>
</div>

<script src="data/content.js"></script>
<script>
(() => {
  "use strict";

  /* The same publishable key the public app ships. On its own it can only
     INSERT; every read below rides on the signed-in user's token. */
  const URL_ = "https://bfneutpsjyfqferkublh.supabase.co";

  /* ------------------------------------------------------------------ read
     One helper for every table. PostgREST caps a response at 1000 rows, so
     this pages until it has everything and says so if it stops. */
  /* ================== WRITE ==================================
     Reads ride on the signed-in user's token; so do writes. RLS decides what
     is allowed, so this cannot do anything the database has not granted:
     UPDATE on bookings and reviews, DELETE on reviews and subscribers, and
     nothing at all on events. A lead can be archived but never deleted.

     The row object is patched in memory and the tab redrawn, rather than
     refetching 2,400 events for a one-field change. */
  async function write(table, id, patch, method) {
    const r = await fetch(URL_ + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
      method: method || "PATCH",
      headers: {
        apikey: KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: method === "DELETE" ? undefined : JSON.stringify(patch)
    });
    if (r.status === 401 && await refreshToken()) return write(table, id, patch, method);
    if (!r.ok) throw new Error((await r.text().catch(() => "")) || ("HTTP " + r.status));
  }

    clearTimeout(toastT);
    toastT = setTimeout(() => { t.className = "toast"; }, bad ? 6000 : 2200);

  /* One handler for every action button, wired after each draw. */
  async function act(btn) {
    const { table, id, field, value, del } = btn.dataset;
    const list = table === "bookings" ? DATA.bookings
               : table === "reviews"  ? DATA.reviews
               : DATA.subs;
    const rowObj = list.find(x => String(x.id) === String(id));
    btn.disabled = true;
    try {
      if (del === "1") {
        if (!confirm("Delete this permanently? This cannot be undone.")) { btn.disabled = false; return; }
        await write(table, id, null, "DELETE");
        const i = list.indexOf(rowObj); if (i > -1) list.splice(i, 1);
        toast("Deleted.");
      } else {
        // "true"/"false" arrive as strings off the button dataset; the
        // `published` column is a real boolean, so coerce before PATCHing.
        const v2 = value === "true" ? true : value === "false" ? false : value;
        const patch = { [field]: v2, handled_at: new Date().toISOString() };
        await write(table, id, patch);
        if (rowObj) Object.assign(rowObj, patch);
        toast(value === "new" ? "Reopened." : "Saved: " + value + ".");

  /* Buttons are rebuilt on every draw, so they are wired after each draw
     rather than once at startup. "Copy tip" never touches the database. */
  function wireActions(scope) {
    scope.querySelectorAll("button.act").forEach(b => {
      b.onclick = () => {

            .then(() => toast("Tip copied — paste it into content.js"))
            .catch(() => toast("Could not reach the clipboard", true));

  /* PostgREST hands out 1000 rows a request. The first request asks for the
     total, then the rest are fetched 4 at a time instead of one after another:
     28 days of events loads in a couple of seconds, not twenty. */
  async function readAll(table, query, cap) {
    cap = cap || 400000;
    const PAGE = 1000;
    const one = async (from, count) => {
      let tries = 0;
      for (;;) {
        const r = await fetch(URL_ + "/rest/v1/" + table + "?" + query, {
          headers: Object.assign({
            apikey: KEY,
            Authorization: "Bearer " + session.access_token,
            Range: from + "-" + (from + PAGE - 1),
            "Range-Unit": "items"
          }, count ? { Prefer: "count=exact" } : {})
        });
        if (r.status === 401) {
          if (await refreshToken()) continue;
          throw Object.assign(new Error("Session expired."), { auth: true });
        }
        if (!r.ok) {
          const t = await r.text().catch(() => "");
          // The database gives up on a page it can't finish in time when many
          // heavy reads land at once (28 days, 31 Oct): wait and ask again.
          if (/57014/.test(t) && tries++ < 3) { await new Promise(z => setTimeout(z, 800 * tries)); continue; }
          // A missing table or a missing SELECT policy both land here.
          throw new Error(table + ": " + r.status + " " + t.slice(0, 160));
        }
        const total = count ? parseInt(String(r.headers.get("content-range") || "").split("/")[1], 10) : NaN;
        return { rows: await r.json(), total };
      }
    };
    const first = await one(0, true);
    const out = first.rows.slice();
    if (out.length < PAGE) return out;
    if (!isFinite(first.total)) {                 // no total exposed: the old way, one page at a time
      for (let from = PAGE; out.length < cap; from += PAGE) {
        const r = await one(from, false);
        out.push.apply(out, r.rows);
        if (r.rows.length < PAGE) break;
      }
      return out;
    }
    const starts = [];
    for (let f = PAGE; f < Math.min(first.total, cap); f += PAGE) starts.push(f);
    const pages = new Array(starts.length);
    let k = 0;
    await Promise.all(Array.from({ length: Math.min(4, starts.length) }, async () => {
      while (k < starts.length) { const j = k++; pages[j] = (await one(starts[j], false)).rows; }
    }));
    pages.forEach(rows => out.push.apply(out, rows));
    return out;
  }

  /* DAYS ARE LOCAL. The dashboard is read in Muscat, so a day runs midnight
     to midnight on this computer's clock, not UTC's: 11pm in Muscat is still
     today, not tomorrow. */
  const pad = n => String(n).padStart(2, "0");
  const localDay = d => { d = new Date(d);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const dayStart = k => new Date(k + "T00:00:00");
  const addDays = (k, n) => { const d = dayStart(k); d.setDate(d.getDate() + n); return localDay(d); };
  const today = () => localDay(new Date());
  const dayLabelOf = k => dayStart(k).toLocaleDateString("en-GB",
    { weekday: "short", day: "numeric", month: "short" });

  const sinceISO = () => day ? dayStart(day).toISOString()
    : custom ? dayStart(custom.from).toISOString()
    : days ? new Date(Date.now() - days * 864e5).toISOString()
    : "1970-01-01T00:00:00Z";
  const untilISO = () => day ? dayStart(addDays(day, 1)).toISOString()
    : custom ? dayStart(addDays(custom.to, 1)).toISOString() : null;
  const inWindow = iso => { const t = new Date(iso);
    return t >= new Date(sinceISO()) && (!untilISO() || t < new Date(untilISO())); };

  /* The chart's x-axis for the range: 24 hours when one day is picked,
     otherwise one slot per local day, ending today. */
  const slotOf = iso => day ? new Date(iso).getHours() : localDay(iso);
  function slots(spanDays) {
    if (day) return Array.from({ length: 24 }, (_, h) => ({ key: h, day, hour: h, label: pad(h) + ":00" }));
    const out = [];
    if (custom) { for (let k = custom.from; k <= custom.to; k = addDays(k, 1)) out.push({ key: k, day: k }); return out; }
    for (let i = spanDays - 1; i >= 0; i--) { const k = addDays(today(), -i); out.push({ key: k, day: k }); }
    return out;
  }

  /* RPC — for reads that need SECURITY DEFINER server-side (the accounts
     list joins auth.users, which PostgREST will not expose as a table). */
  async function rpc(fn, args) {
    const r = await fetch(URL_ + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        apikey: KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(args || {})
    });
    if (r.status === 401 && await refreshToken()) return rpc(fn, args);
    if (!r.ok) throw new Error(fn + ": " + r.status + " " + (await r.text().catch(() => "")).slice(0, 120));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  async function loadAll() {

      + (day || custom ? "&created_at=lt." + new Date(R.ce).toISOString() : "");
    const [events, subs, bookings, reviews] = await Promise.all([

    let accounts = null, usaves = [], uvisits = [], udevices = [];

  /* ------------------------------------------------------------- crunching */
  const propOf = (e, k) => {
    const p = e.props;
    if (!p) return null;
    if (typeof p === "string") { try { return JSON.parse(p)[k]; } catch { return null; } }
    return p[k];
  };
  const dayOf = iso => localDay(iso);

  function tally(list, keyFn) {
    const m = new Map();
    list.forEach(x => {
      const k = keyFn(x);
      if (k == null || k === "") return;
      m.set(k, (m.get(k) || 0) + 1);
    });
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }

  function uniq(list, keyFn) {
    const s = new Set();
    list.forEach(x => { const k = keyFn(x); if (k) s.add(k); });
    return s.size;
  }

    "Asia/Phnom_Penh":"Cambodia","Asia/Vientiane":"Laos","Europe/Belgrade":"Serbia",
