  const countryOf = tz => TZ[tz] || (tz ? tz.split("/").pop().replace(/_/g, " ") : "unknown");

  const median = arr => {
    if (!arr.length) return 0;
    const a = arr.slice().sort((x, y) => x - y);
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
  };
  const secs = ms => ms >= 60000
    ? Math.floor(ms / 60000) + "m " + Math.round((ms % 60000) / 1000) + "s"
    : Math.round(ms / 1000) + "s";

  /* ================= SESSIONS, THE INDUSTRY WAY =========================
     Both GA4 and Plausible derive a visit from the event stream rather than
     from anything the page reports: a visit starts on the first action and
     ends after 30 minutes with no action. Doing the same here means every
     one of your historic events becomes usable — visit counts, bounce rate
     and views-per-visit work on data recorded long before any of this was
     built, instead of starting from zero today.

     ENGAGED, GA4's exact test: longer than 10 seconds, OR two or more
     screen views, OR at least one key event. Bounce rate is its inverse —
     which is why "bounce" here is not "left after one page", it is "left
     without doing anything worth counting". */
  const KEY_EVENTS = new Set(["spot", "search", "maps_click", "save", "been", "plan",
    "whatsapp_click", "share", "buy_click", "product_click", "trip_intent",
    "unlock", "book_click", "insta_click", "aff_click"]);

  function sessionize(ev) {
    const byDev = new Map();
    ev.forEach(e => {
      if (!e.device_id) return;
      if (!byDev.has(e.device_id)) byDev.set(e.device_id, []);
      byDev.get(e.device_id).push(e);
    });
    const out = [];
    byDev.forEach((list, dev) => {
      list.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      let cur = null;
      list.forEach(e => {
        const t = new Date(e.created_at).getTime();
        if (!cur || t - cur.last > 30 * 60000) {          // the 30-minute rule
          cur = { dev: dev, start: t, last: t, views: 0, keys: 0, n: 0,
                  entry: null, exit: null, day: dayOf(e.created_at) };
          out.push(cur);
        }
        cur.last = t; cur.n++;
        if (e.event === "view") {
          cur.views++;
          const tab = propOf(e, "tab");
          if (tab) { if (!cur.entry) cur.entry = tab; cur.exit = tab; }
        }
        if (KEY_EVENTS.has(e.event)) cur.keys++;
      });
    });
    out.forEach(s => {
      s.dur = s.last - s.start;
      s.engaged = s.dur > 10000 || s.views >= 2 || s.keys > 0;
    });
    return out;
  }

  /* Referrers grouped the way every analytics tool groups them, so "where
     traffic comes from" is four readable lines instead of forty hostnames. */
  function channelOf(host) {
    if (!host || host === "direct / app") return "Direct / messaging apps";
    if (/google|bing|duckduckgo|yahoo|yandex|baidu|ecosia/.test(host)) return "Search";
    if (/instagram|facebook|fb\.|tiktok|twitter|x\.com|t\.co|reddit|pinterest|youtube|linkedin|snapchat/.test(host)) return "Social";
    if (/whatsapp|telegram|messenger|wa\.me/.test(host)) return "Messaging";
    return "Other sites";
  }

  /* Everything the dashboard shows, derived once per load. */
  function crunch(d) {
    const ev = d.events;
    const inRange = rows => rows.filter(r => inWindow(r.created_at));
    const subs = inRange(d.subs), bookings = inRange(d.bookings), reviews = inRange(d.reviews);

    const spotEv = ev.filter(e => e.event === "spot");

    /* A PERSON vs A DEVICE THAT LOADED THE PAGE.
       Crawlers, link previewers and accidental opens all get a device_id the
       moment the page runs, so counting distinct ids counts them too — that
       is why "148" felt high. Someone who actually DID something is a person;
       someone who only fired a page view is not counted. */
    const REAL = new Set(["spot","search","maps_click","save","been","plan","type_filter",
                          "whatsapp_click","share","insta_click","aff_click","buy_click",
                          "product_click","trip_intent","unlock","view_mode","tripday",
                          "spot_time","book_click"]);
    const sess = sessionize(ev);
    const engaged = new Set();
    const allDev  = new Set();
    ev.forEach(e => { if (!e.device_id) return;
                      allDev.add(e.device_id);
                      if (REAL.has(e.event)) engaged.add(e.device_id); });
    const ctx      = ev.filter(e => e.event === "session_start");
    // One row per DEVICE (its latest reading), so "what they're on" counts
    // devices rather than re-counting the same phone on every visit.
    const ctxByDev = new Map();
    ctx.forEach(e => { if (e.device_id) ctxByDev.set(e.device_id, e); });
    const ctxDev = [...ctxByDev.values()];
    const searchEv = ev.filter(e => e.event === "search");
    const mapsEv   = ev.filter(e => e.event === "maps_click");
    const errEv    = ev.filter(e => e.event === "error");
    const dwellEv = ev.filter(e => e.event === "spot_time");
    const sessEv  = ev.filter(e => e.event === "session");
    const heldEv = ev.filter(e => e.event === "held_click" || e.event === "held_blocked");

    /* People per slot (local day, or hour of the picked day). Same test as
       the People tile: a device that did something, not one that only loaded
       the page, so the chart, the tile and the table below all agree. */
    const bySlot = new Map();
    ev.forEach(e => {
      if (!e.device_id || !REAL.has(e.event)) return;
      const k = slotOf(e.created_at);
      if (!bySlot.has(k)) bySlot.set(k, new Set());
      bySlot.get(k).add(e.device_id);
    });
    const oldest = ev.length ? ev[ev.length - 1].created_at : Date.now();
    const span = days || Math.max(1, Math.round((dayStart(today()) - dayStart(dayOf(oldest))) / 864e5) + 1);
    const series = slots(span).map(x => Object.assign(x, { n: (bySlot.get(x.key) || new Set()).size }));

    /* DAY BY DAY: one row per local day in the range, newest first. A quiet
       day stays a row of zeros, never smoothed over. Not built for a single
       picked day, where the hourly chart does that job. */
    const daily = day ? [] : series.map(x => ({ day: x.day, people: x.n, visits: 0, places: 0,
      maps: 0, emails: 0, leads: 0, reviews: 0, accounts: 0 }));
    if (daily.length) {
      const row = new Map(daily.map(r => [r.day, r]));
      const bump = (iso, f) => { const r = row.get(dayOf(iso)); if (r) r[f]++; };
      ev.forEach(e => {
        if (e.event === "spot") bump(e.created_at, "places");
        else if (e.event === "maps_click") bump(e.created_at, "maps");
      });
      sess.forEach(x => { const r = row.get(x.day); if (r) r.visits++; });
      subs.forEach(x => bump(x.created_at, "emails"));
      bookings.forEach(x => bump(x.created_at, "leads"));
      reviews.forEach(x => bump(x.created_at, "reviews"));
      (d.accounts || []).forEach(a => bump(a.created_at, "accounts"));
      daily.reverse();
    }

    return {
      dropped: d.dropped || 0,            // ours + test browsers + crawlers, not counted anywhere
      devices: engaged.size,              // the headline: people who did something
      devicesAll: allDev.size,            // everything that loaded the page
      passers: allDev.size - engaged.size,
      events: ev.length,
      views: ev.filter(e => e.event === "view").length,
      spotOpens: spotEv.length,
      subs, bookings, reviews,
      series, daily,
      tabs: tally(ev.filter(e => e.event === "view"), e => propOf(e, "tab")),
      spots: tally(spotEv, e => propOf(e, "id")),
      held: tally(heldEv, e => propOf(e, "id")),
      saves: tally(ev.filter(e => e.event === "save" && propOf(e, "on") === true), e => propOf(e, "id")),
      names: tally(ev, e => e.event),
      whatsapp: ev.filter(e => e.event === "whatsapp_click").length,
      products: tally(ev.filter(e => e.event === "product_click"), e => propOf(e, "product")),
      tripIntents: ev.filter(e => e.event === "trip_intent"),
      /* THE WELCOME SCREEN (first visit to the homepage). "welcome" is sent
         when someone leaves it, with the button; "welcome_shown" (js/
         welcome-seen.js, 17 Oct 2026) when it appears. Devices that saw it and
         never sent "welcome" left without tapping. Before 17 Oct only the taps
         exist, so "saw it" undercounts until the range is all after that. */
      welcome: (() => {
        const shownEv = ev.filter(e => e.event === "welcome_shown");
        const left = ev.filter(e => e.event === "welcome");
        const shown = new Set(shownEv.map(e => e.device_id).filter(Boolean));
        const tapped = new Set(left.map(e => e.device_id).filter(Boolean));
        const by = a => uniq(left.filter(e => (propOf(e, "action") || "dismissed") === a), e => e.device_id);
        const ofShown = a => uniq(left.filter(e => shown.has(e.device_id) && (propOf(e, "action") || "dismissed") === a), e => e.device_id);
        return { shown: shown.size, plan: by("plan"), explore: by("explore"), closed: by("dismissed"),
                 planOfShown: ofShown("plan"), exploreOfShown: ofShown("explore"), closedOfShown: ofShown("dismissed"),
                 noTap: [...shown].filter(d => !tapped.has(d)).length,
                 since: shownEv.length ? shownEv[shownEv.length - 1].created_at : null };
      })(),
      sources: tally(ev.filter(e => e.event === "trip_intent"), e => propOf(e, "source")),
      months: tally(ev.filter(e => e.event === "trip_intent"), e => propOf(e, "trip_month")),
      raw: ev.slice(0, 300),

      /* ---- accounts (null until stats-users-access.sql has been run) ---- */
      accounts: d.accounts,
      usaves: d.usaves || [],
      uvisits: d.uvisits || [],
      udevices: d.udevices || [],

      /* ---- who they are (from session_start) ---- */
      ctxCount: ctx.length,
      countries: tally(ctxDev, e => countryOf(propOf(e, "tz"))),
      zones:     tally(ctxDev, e => propOf(e, "tz")),
      kinds:     tally(ctxDev, e => propOf(e, "k")),
      oses:      tally(ctxDev, e => propOf(e, "os")),
      browsers:  tally(ctxDev, e => propOf(e, "br")),
      screens:   tally(ctxDev, e => { const w = +propOf(e, "w") || 0;
                   return !w ? "" : w < 400 ? "Small phone (<400px)"
                        : w < 500 ? "Phone (400-500px)"
                        : w < 800 ? "Large phone / small tablet"
                        : w < 1200 ? "Tablet / laptop" : "Desktop (1200px+)"; }),
      langs:     tally(ctxDev, e => propOf(e, "lang")),
      knownDevices: ctxDev.length,
      refs:      tally(ctx, e => { const r = propOf(e, "ref");
                                   if (!r) return "direct / app";
                                   try { return new URL(r).hostname; } catch { return r; } }),

      /* ---- how long they stayed ---- */
      dwellMedian: median(dwellEv.map(e => +propOf(e, "ms") || 0).filter(Boolean)),
      dwellReads: dwellEv.length,
      dwellBySpot: (() => {
        const m = new Map();
        dwellEv.forEach(e => {
          const id = propOf(e, "id"), ms = +propOf(e, "ms") || 0;
          if (!id || !ms) return;
          if (!m.has(id)) m.set(id, []);
          m.get(id).push(ms);
        });
        return [...m.entries()]
          .map(([id, list]) => [id + "  ·  " + list.length + " reads", median(list)])
          .sort((a, b) => b[1] - a[1]);
      })(),
      sessionMedian: (() => {
        const best = new Map();          // one reading per session id, the highest
        sessEv.forEach(e => {
          const sid = propOf(e, "sid"), ms = +propOf(e, "ms") || 0;
          if (!sid) return;
          best.set(sid, Math.max(best.get(sid) || 0, ms));
        });
        return median([...best.values()]);
      })(),
      sessionCount: uniq(sessEv, e => propOf(e, "sid")),
      sessionStats: (() => {
        const best = new Map();
        sessEv.forEach(e => { const sid = propOf(e, "sid"); if (!sid) return;
          best.set(sid, Math.max(best.get(sid) || 0, +propOf(e, "ms") || 0)); });
        const v = [...best.values()].filter(Boolean);
        const buckets = [["Under 30 seconds", 0], ["30s to 2 min", 0], ["2 to 5 min", 0],
                         ["5 to 15 min", 0], ["Over 15 min", 0]];
        v.forEach(ms => {
          const m = ms / 60000;
          if (ms < 30000) buckets[0][1]++;
          else if (m < 2)  buckets[1][1]++;
          else if (m < 5)  buckets[2][1]++;
          else if (m < 15) buckets[3][1]++;
          else             buckets[4][1]++;
        });
        return { buckets, mean: v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : 0,
                 max: v.length ? Math.max(...v) : 0, n: v.length };
      })(),

      /* ---- what they typed, and what they didn't find ---- */
      searches: tally(searchEv, e => propOf(e, "q")),
      zeroSearches: tally(searchEv.filter(e => (+propOf(e, "n") || 0) === 0), e => propOf(e, "q")),
      searchCount: searchEv.length,

      /* ---- who actually set off driving ---- */
      maps: tally(mapsEv, e => propOf(e, "spot")),
      mapsTotal: mapsEv.length,
      mapsPeople: uniq(mapsEv, e => e.device_id),

      /* ---- which post sent them ---- */
      campaigns: tally(ctx, e => propOf(e, "camp")),
      campSrc:   tally(ctx, e => propOf(e, "src")),
      viaPage:   ctx.filter(e => propOf(e, "via") === "page").length,

      /* ---- things that broke ---- */
      errors: tally(errEv, e => propOf(e, "msg")),
      errorRows: errEv.slice(0, 40),
      errorPeople: uniq(errEv, e => e.device_id),

      /* ---- visit quality, the standard definitions ---- */
      visits: sess.length,
      engagedVisits: sess.filter(x => x.engaged).length,
      engagementRate: sess.length ? Math.round(sess.filter(x => x.engaged).length / sess.length * 100) : 0,
      bounceRate: sess.length ? Math.round((1 - sess.filter(x => x.engaged).length / sess.length) * 100) : 0,
      viewsPerVisit: sess.length
        ? Math.round(sess.reduce((a, x) => a + x.views, 0) / sess.length * 10) / 10 : 0,
      derivedDuration: median(sess.filter(x => x.dur > 0).map(x => x.dur)),
      entryTabs: tally(sess, x => x.entry),
      exitTabs:  tally(sess.filter(x => x.views > 1), x => x.exit),
      channels:  tally(ctx, e => channelOf((() => { const r = propOf(e, "ref");
                    if (!r) return "direct / app";
                    try { return new URL(r).hostname.replace(/^www\./, ""); } catch { return r; } })())),
      liveNow: uniq(ev.filter(e => Date.now() - new Date(e.created_at) < 5 * 60000), e => e.device_id),

      /* ---- the funnel, by DEVICE not by event ---- */
      funnel: [
        ["Opened the app",     uniq(ev, e => e.device_id)],
        ["Opened a spot",      uniq(spotEv, e => e.device_id)],
        ["Shared something",   uniq(ev.filter(e => e.event === "whatsapp_click" || e.event === "share"), e => e.device_id)],
        ["Gave an email",      uniq(ev.filter(e => e.event === "trip_intent"), e => e.device_id)],
        ["Clicked buy",        uniq(ev.filter(e => e.event === "buy_click" || e.event === "product_click"), e => e.device_id)],
        ["Unlocked",           uniq(ev.filter(e => e.event === "unlock"), e => e.device_id)]
      ]
    };
  }

  /* =====================================================================
     PERFORMANCE, THE SEARCH CONSOLE WAY (19 Oct 2026)
     ONE MODEL FOR EVERY NUMBER ON THE PAGE, so no two numbers can disagree:
     - A PERSON is one human. Device ids that share a page-load id (sid) are
       one person: Instagram's iPhone browser used to lose its storage a few
       seconds into a visit, and the rest of that visit arrived under a new
       id (js/analytics.js keeps one id per page load since 19 Oct; this
       stitches the history back together). A new id on the same phone
       (system, screen, clock, language) that starts within seconds of the
       last one going quiet is the same person too: "Open in Safari".
     - NOT COUNTED: devices marked with ?me=on, the test laptop, and bots
       (a UTC clock, a 1x iPhone screen, an "Android" desktop, the headless
       800px default, Meta's ad reviewers in Los Angeles).
     - A VISIT is one person's activity with no gap over 30 minutes.
     - Every card, chart line, table row and panel is counted from the same
       visits, so a filter changes all of them at once.
     ===================================================================== */
  const MET = [
    { id: "people",  label: "People",         c: "#4285f4" },
    { id: "visits",  label: "Visits",         c: "#5e35b1" },
    { id: "opened",  label: "Opened a place", c: "#00897b" },
    { id: "reached", label: "Reached out",    c: "#e8710a" }
  ];
  let selM = { people: true, visits: true, opened: false, reached: false };
  let dimTab = "source", filters = [], sortBy = null, sortDir = -1, pageNo = 0;
  days = 28;
  try {
    const s = JSON.parse(localStorage.getItem("oman_stats_view") || "null");
    if (s) {
      if (s.selM && typeof s.selM === "object") selM = Object.assign(selM, s.selM);
      if ([1, 7, 28, 90, 0].includes(s.days)) days = s.days;
      if (typeof s.dimTab === "string") dimTab = s.dimTab;
    }
  } catch {}
  const saveView = () => {
    try { localStorage.setItem("oman_stats_view", JSON.stringify({ selM, days, dimTab })); } catch {}
  };

  const propsOf = e => {
    if (e._p) return e._p;
    let p = e.props;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch { p = {}; } }
    return (e._p = p || {});
  };
  const tOf = e => e._t || (e._t = Date.parse(e.created_at));

  /* Names: the guide's own content file, so a place reads "Daymaniyat
     Islands", not "daymaniyat". */
  const NAMES = (() => {
    const m = new Map();
    try {
      ((window.OMAN_DATA && window.OMAN_DATA.spots) || []).forEach(s => {
        if (s && s.id && s.name && !m.has(s.id)) m.set(s.id, s.name);
      });
    } catch {}
    return m;
  })();
  const placeName = id => NAMES.get(id) || String(id || "unknown").replace(/-/g, " ");
  const PAGE_NAMES = { wadis: "Front page", explore: "Explore", plan: "Plan", routes: "Routes",
    info: "Info", about: "About", planmytrip: "Trip form", shop: "Shop", saved: "Saved" };
  const normTab = t => String(t || "").replace(/^#?\/?/, "").replace(/\.html.*$/, "").replace(/[?#].*$/, "");
  function pageName(t) {
    t = normTab(t);
    if (!t) return "Front page";
    if (PAGE_NAMES[t]) return PAGE_NAMES[t];
    let m = /^s\/([\w-]+)/.exec(t);
    if (m) return "Place page: " + placeName(m[1]);
    m = /^p\/([\w-]+)/.exec(t);
    if (m) return "Route page: " + placeName(m[1]);
    m = /^info\/([\w-]+)/.exec(t);
    if (m) return "Info: " + m[1].replace(/-/g, " ");
    return t;
  }
  /* The landing address js/analytics.js records ("/s/x.html#/s/x", "/#/plan", "/"). */
  function landKey(land) {
    land = String(land || "");
    const h = land.split("#/")[1];
    if (h) return normTab(h);
    const m = /^\/(s|p|info)\/([\w-]+)\.html/.exec(land);
    return m ? m[1] + "/" + m[2] : "wadis";
  }
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, "").toLowerCase(); } catch { return ""; } };
  const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  /* WHERE A VISIT CAME FROM, read off the page load that started it:
     a ?utm_source= / ?src= tag first (it survives Instagram's link wrapper
     and "Open in Safari"), then the app's built-in browser, then the
     referring site. No referrer at all = a typed address, a bookmark or a
     link shared in WhatsApp or a text, which never pass one on. */
  function sourceOf(c) {
    if (!c) return { ch: "Unknown", sub: "" };
    const host = hostOf(c.ref), src = String(c.src || "").toLowerCase(),
          med = String(c.med || "").toLowerCase(), app = String(c.app || ""), camp = String(c.camp || "");
    const t = src + " " + host;
    let ch;
    if (/^(ig|insta)/.test(src) || /instagram/.test(host) || app === "instagram") ch = "Instagram";
    else if (/^(fb|facebook|meta)/.test(src) || /facebook|(^|\.)fb\.(com|me)$/.test(host) || app === "facebook") ch = "Facebook";
    else if (/^(tt|tiktok)/.test(src) || /tiktok/.test(host) || app === "tiktok") ch = "TikTok";
    else if (/^(yt|youtube)/.test(src) || /youtube|youtu\.be/.test(host)) ch = "YouTube";
    else if (/^(wa|whatsapp)/.test(src) || /whatsapp|wa\.me/.test(host) || app === "whatsapp") ch = "WhatsApp";
    else if (/reddit/.test(t)) ch = "Reddit";
    else if (/pinterest/.test(t)) ch = "Pinterest";
    else if (/snapchat/.test(t) || app === "snapchat") ch = "Snapchat";
    else if (/linkedin/.test(t) || app === "linkedin") ch = "LinkedIn";
    else if (/^(x|twitter)$/.test(src) || /^(t\.co|twitter\.com|x\.com)$/.test(host)) ch = "X (Twitter)";
    else if (/chatgpt|openai|perplexity|claude\.ai|gemini\.google|copilot/.test(t)) ch = "AI assistants";
    else if (/(^|\.)google\./.test(host) || /^google/.test(src) || app === "google-app") ch = "Google";
    else if (/(^|\.)bing\.com$/.test(host) || /^bing/.test(src)) ch = "Bing";
    else if (/duckduckgo|yahoo|ecosia|yandex|baidu|search\.brave/.test(host)) ch = "Other search";
    else if (src) ch = cap1(src);
    else if (!host || /(^|\.)exploresoman\.com$|localhost|127\.0\.0\.1/.test(host)) ch = "Direct or shared link";
    else ch = host;
    // the finer tag inside a source: ?src=ig_story, utm_medium=bio, ?r=post9
    const variant = (src.match(/^[a-z]+[_\-.](.+)$/) || [])[1] || "";
    const generic = /^(social|referral|cpc|paid|organic|link|)$/;
    const sub = camp || variant || (generic.test(med) ? "" : med);
    return { ch, sub };
  }
  const SUBNONE = "(no tag)";

  /* Our own devices: marked with ?me=on, Ali's laptop (Windows, Oman time,
     a screen of 0/390/1280/1440/1536 that no visitor's Windows PC reports
     together with that clock), anything on a localhost preview. */
  /* Test phones and browsers that never got ?me=on: Ali's iPhone and the
     second phone the Cheat Sheet checkout was tested on (31 Oct), and the
     browsers of the 13 Oct form tests ("TEST Sara", "TEST Omar", "a"). Like
     ?me=on, they drop out of every count; so does any phone that leaves the
     same WhatsApp number as one of ours (oursIds below). */
  const TEST_DEVICES = ["3d05488d-f9a9-45cc-ad52-e14828bc9159", "53d66328-cd11-460d-907d-44b59e83ce53",
                        "c08184eb-20f8-457a-8dc0-4d299003dcb8", "0286ff66-b0c7-40e4-8503-1ed73a66a25b"];
  const isOurs = c => !!c && ((c.os === "Windows" && /^Asia\/(Muscat|Dubai)$/.test(String(c.tz || "")) &&
    [0, 390, 1280, 1440, 1536].includes(+c.w || 0)) || /localhost|127\.0\.0\.1/.test(String(c.ref || "")));
  function isBot(c, did) {
    if (!c) return false;
    const w = +c.w || 0, dpr = +c.dpr || 0, tz = String(c.tz || ""), os = c.os || "";
    if (/^(UTC|Etc\/|GMT)/.test(tz)) return true;                              // servers keep UTC; phones never do
    if (os === "other") return true;                                          // no real system string at all
    if (os === "Linux" && (w === 0 || w === 800 || w >= 1900)) return true;   // headless renderers
    if (os === "iOS" && dpr > 0 && dpr < 2) return true;                      // no iPhone this decade has a 1x screen
    if (os === "Android" && dpr === 1 && (c.k === "desktop" || w >= 900)) return true;
    if (w === 800 && dpr === 1 && os !== "iOS" && os !== "Android") return true;
    if (tz === "America/Los_Angeles" && dpr === 1 && !did) return true;       // Meta's ad review fleet
    return false;
  }
  /* Signals the page sends by itself (attention pings, the "ask" nudge, how
     long a sheet stayed open, errors): they belong to a visit already
     happening and never start one, so a page waking up in a background tab
     is not a visit. */
  const PASSIVE = new Set(["session", "ask_earned", "spot_time", "error", "vsl_watch"]);
  const DID = new Set(["spot", "search", "maps_click", "save", "been", "plan", "type_filter", "whatsapp_click",
    "share", "insta_click", "aff_click", "buy_click", "product_click", "trip_intent", "unlock", "view_mode",
    "tripday", "spot_time", "book_click", "book_cta", "welcome", "lead", "lead_open",
    "pdf_open", "pdf_card_tap", "pdf_checkout", "purchase", "pdf_wa", "pdf_wa_pre"]);
  const deviceOf = c => !c ? "Unknown"
    : c.os === "iOS" ? ((+c.w || 0) >= 700 || c.k === "tablet" ? "iPad" : "iPhone")
    : c.os === "Android" ? (c.k === "tablet" ? "Android tablet" : "Android phone")
    : c.k === "tablet" ? "Tablet" : "Computer";

  /* The range as numbers: current [cs, ce), previous [ps, cs) or none. */
  let NOW = Date.now();
  function rangeNow() {
    NOW = Date.now();
    if (day) return { cs: dayStart(day).getTime(), ce: dayStart(addDays(day, 1)).getTime(),
                      ps: dayStart(addDays(day, -1)).getTime(), hourly: true };
    if (custom) { const cs = dayStart(custom.from).getTime(), ce = dayStart(addDays(custom.to, 1)).getTime();
                  return { cs, ce, ps: cs - (ce - cs), hourly: false }; }
    if (!days) return { cs: 0, ce: NOW + 1, ps: null, hourly: false };
    const cs = NOW - days * 864e5;
    return { cs, ce: NOW + 1, ps: cs - days * 864e5, hourly: days === 1 };
  }

  function buildModel(all, internalIds, R) {
    const ev = all.filter(e => e.device_id).sort((a, b) => tOf(a) - tOf(b));
    /* 1. who is who: union-find over device ids */
    const par = new Map();
    const find = x => { let r = x; while (par.get(r) !== r) r = par.get(r);
      while (par.get(x) !== r) { const n = par.get(x); par.set(x, r); x = n; } return r; };
    const join = (a, b) => { a = find(a); b = find(b); if (a !== b) par.set(b, a); };
    const internal = new Set(internalIds || []);
    const dev = new Map(), sidStart = new Map(), sidOwner = new Map();
    ev.forEach(e => {
      const d = e.device_id, t = tOf(e), p = propsOf(e);
      if (!par.has(d)) par.set(d, d);
      let x = dev.get(d);
      if (!x) dev.set(d, x = { id: d, first: t, last: t, ctx: null, did: false, firstView: null });
      x.last = t;
      if (e.event === "view" && x.firstView == null) x.firstView = normTab(p.tab) || "wadis";
      if (e.event === "internal") internal.add(d);
      if (e.event === "session_start") { if (!x.ctx) x.ctx = p; if (p.sid && !sidStart.has(p.sid)) sidStart.set(p.sid, p); }
      if (DID.has(e.event)) x.did = true;
      if (p.sid) { const o = sidOwner.get(p.sid); if (o) join(o, d); else sidOwner.set(p.sid, d); }
    });
    // same phone, new id within seconds of the old one going quiet
    const groups = new Map();
    dev.forEach(x => { if (!x.ctx) return;
      const s = [x.ctx.os, x.ctx.w, x.ctx.dpr, x.ctx.tz, x.ctx.lang].join("|");
      if (!groups.has(s)) groups.set(s, []); groups.get(s).push(x); });
    /* ...and so is a new id that CARRIES ON mid-site within 10 minutes of
       the last one: no Instagram link in front of it, and it starts on
       Explore or Plan (a welcome button had already moved the address) or
       comes from our own page. That is a reload or "Open in Safari", and
       Instagram's browser drops its storage on a reload too. */
    /* ...and a FIRST visit that says it came from our own page is never a
       newcomer (nobody arrives from exploresoman.com for the first time):
       it is someone already here whose id was lost on a reload, often after
       they came back to Instagram's browser 20+ minutes later. It joins the
       same phone that was last on the site, up to 6 hours before. */
    const t0 = ev.length ? tOf(ev[0]) : 0;
    groups.forEach(list => {
      if (list.length < 2) return;
      list.sort((a, b) => a.first - b.first);
      for (let j = 1; j < list.length; j++) {
        const b = list[j], bs = sourceOf(b.ctx).ch, bh = hostOf(b.ctx.ref), ours = /(^|\.)exploresoman\.com$/.test(bh);
        const carriesOn = (!bh || ours) && (ours || (!!b.firstView && b.firstView !== "wadis"));
        const ownFirst = ours && b.first - t0 > 6 * 3600e3;     // its true first visit is inside the loaded data
        let best = null, bestGap = Infinity;
        for (let i = j - 1; i >= 0; i--) {
          const a = list[i];
          if (b.first - a.first > 12 * 3600e3) break;
          if (find(a.id) === find(b.id)) continue;
          const gap = b.first - a.last, as = sourceOf(a.ctx).ch;
          const quick = gap >= -30e3 && gap <= 90e3 &&
            (as === bs || as === "Direct or shared link" || bs === "Direct or shared link");
          const reopen = carriesOn && gap >= -600e3 && gap <= 600e3;
          const own = ownFirst && gap >= -600e3 && gap <= 6 * 3600e3;
          if ((quick || reopen || own) && Math.abs(gap) < bestGap) { best = a; bestGap = Math.abs(gap); }
        }
        if (best) join(best.id, b.id);
      }
    });
    /* 2. people, and who is not counted */
    const people = new Map();
    dev.forEach(x => {
      const r = find(x.id);
      let p = people.get(r);
      if (!p) people.set(r, p = { id: r, devs: [], ctx: null, ctxT: Infinity, first: x.first, did: false, ours: false, bot: false });
      p.devs.push(x);
      if (x.first < p.first) p.first = x.first;
      if (x.ctx && x.first < p.ctxT) { p.ctx = x.ctx; p.ctxT = x.first; }
      if (x.did) p.did = true;
      if (internal.has(x.id) || isOurs(x.ctx)) p.ours = true;
    });
    people.forEach(p => {
      // no phone details on any visit and never touched anything: one "page opened" signal and
      // nothing after it, which a real phone never does (it always sends its details a moment later)
      p.bot = !p.ours && (p.devs.some(x => isBot(x.ctx, p.did)) || (!p.ctx && !p.did));
      p.country = p.ctx ? countryOf(p.ctx.tz) : "Unknown";
      p.device = deviceOf(p.ctx);
    });
    /* 3. visits: the 30-minute rule, per person */
    const byP = new Map();
    ev.forEach(e => {
      if (e.event === "internal") return;
      const p = people.get(find(e.device_id));
      if (!p || p.ours || p.bot) return;
      if (!byP.has(p)) byP.set(p, []);
      byP.get(p).push(e);
    });
    const visits = [];
    byP.forEach((list, p) => {
      let v = null;
      const seenMs = new Map();
      list.forEach(e => {
        const t = tOf(e), pr = propsOf(e), sid = pr.sid;
        /* "Still here" from an open page adds its new attention time to the
           visit it belongs to, and never starts or stretches one: a tab left
           open in the background is not a visit (one laptop in Brisbane was
           31 "visits", 27 of them this). */
        if (PASSIVE.has(e.event)) {
          const ms = +pr.ms || 0, was = sid ? (seenMs.get(sid) || 0) : 0;
          if (e.event === "session" && sid) seenMs.set(sid, Math.max(was, ms));
          if (v && t - v.end <= 30 * 60e3) {
            if (e.event === "session") v.active += Math.max(0, ms - was);
            if (e.event === "error") v.errors.push(String(pr.msg || "error").slice(0, 140));
            if (e.event === "vsl_watch") {                       // watch time, sent when they leave the video
              const q = v.vsl || (v.vsl = {}), D = q.dur || 142;
              q.secs = Math.max(q.secs || 0, +pr.secs || 0); q.ss = Math.max(q.ss || 0, +pr.snd_secs || 0);
              q.sfar = Math.max(q.sfar || 0, pr.snd_far != null ? +pr.snd_far : (+pr.snd_pct || 0) / 100 * D);
              q.mfar = Math.max(q.mfar || 0, pr.far != null ? +pr.far : (+pr.pct || 0) / 100 * D);
              if (pr.at != null) q.exitAt = +pr.at;
            }
            if (sid && !v.sids.includes(sid)) v.sids.push(sid);
          }
          return;
        }
        if (!v || t - v.end > 30 * 60e3) {
          v = { p, start: t, end: t, sids: [], pages: new Set(), places: new Set(), maps: new Set(),
                f: {}, land: null, active: 0, searches: [], errors: [], welShown: false, welAct: null };
          visits.push(v);
        }
        v.end = t;
        if (sid && !v.sids.includes(sid)) v.sids.push(sid);
        switch (e.event) {
          case "view": { const tb = normTab(pr.tab) || "wadis"; v.pages.add(tb); if (!v.land) v.land = tb; break; }
          case "spot": if (pr.id) v.places.add(pr.id); v.f.spot = 1; break;
          case "maps_click": v.f.maps = 1; if (pr.spot) v.maps.add(pr.spot); break;
          case "whatsapp_click": v.f.wa = 1; if (pr.source === "plan") v.f.planWa = 1;
            if (!v.reachT) { v.reachT = t; v.reachVia = pr.source === "plan" ? "WhatsApp on the form" : "WhatsApp button"; v.reachHeard = pr.vsl_heard != null ? +pr.vsl_heard : null; } break;
          case "header_cta": v.f.waTop = 1;                                        // the WhatsApp button top right
            if (!v.reachT) { v.reachT = t; v.reachVia = "WhatsApp top right"; v.reachHeard = pr.vsl_heard != null ? +pr.vsl_heard : null; } break;
          case "lead": v.f.form = 1; break;                           // the lead pop-up (Leads tab), not the Plan page
          case "trip_intent": v.f.email = 1; break;
          case "book_cta": v.f.book = 1; break;                       // "Book" only scrolls to the plan section
          case "book_click": v.f.planForm = 1;                                     // the Plan page form, sent
            if (!v.reachT) { v.reachT = t; v.reachVia = "Sent the form"; v.reachHeard = pr.vsl_heard != null ? +pr.vsl_heard : null; } break;
          /* THE VIDEO on Plan for me (25 Oct): see the VSL notes in app.js */
          case "vsl_start": { const q = v.vsl || (v.vsl = {}); q.starts = (q.starts || 0) + 1;
            if (!q.t0) { q.t0 = t; q.mode = pr.mode || "muted"; q.dur = +pr.dur || 0; } break; }
          case "vsl_sound": { const q = v.vsl || (v.vsl = {});
            if (!q.sndT) { q.sndT = t; q.how = pr.via || ""; if (pr.at != null) q.onAt = +pr.at; } break; }
          case "vsl_progress": { const q = v.vsl || (v.vsl = {});     // seconds into the video (10 s marks; older: % marks)
            const S = pr.at != null ? +pr.at : (+pr.pct || 0) / 100 * (q.dur || 142);
            (q.pr || (q.pr = [])).push([t, S, !!pr.snd]);
            if (pr.snd) q.sfar = Math.max(q.sfar || 0, S); else q.mfar = Math.max(q.mfar || 0, S); break; }
          case "vsl_end": { const q = v.vsl || (v.vsl = {}), S = q.dur || 142; (q.pr || (q.pr = [])).push([t, S, !!pr.snd]);
            if (pr.snd) { q.sfar = S; q.send = 1; } else q.mfar = S; break; }
          case "vsl_pause": { const q = v.vsl || (v.vsl = {}); (q.pauses || (q.pauses = [])).push([t, +pr.at || 0, !!pr.snd]); break; }
          case "vsl_seek": { const q = v.vsl || (v.vsl = {}); (q.seeks || (q.seeks = [])).push([t, +pr.from || 0, +pr.to || 0]); break; }
          case "vsl_fs": (v.vsl || (v.vsl = {})).fs = 1; break;
          /* CHEAT SHEET (30 Oct 2026): banner seen -> opened -> started paying -> bought (purchase, product pdf:...) */
          case "pdf_seen": v.f.pdfSeen = 1; break;
          case "pdf_open": v.f.pdfOpen = 1; break;
          case "pdf_card_tap": case "pdf_checkout": v.f.pdfCheckout = 1; break;
          case "purchase": if (/^pdf:/.test(String(pr.product || ""))) v.f.pdfBuy = 1; break;
          case "pdf_wa": case "pdf_wa_pre": v.f.pdfWa = 1; break;
          case "aff_click": if (/whatsapp|wa\.me/i.test(String(pr.href || ""))) v.f.wa = 1; else v.f.partner = 1; break;
          case "insta_click": v.f.insta = 1; break;
          case "search": if (pr.q) v.searches.push([t, String(pr.q).trim().toLowerCase(), +pr.n || 0]); break;
          case "save": if (pr.on !== false) v.f.save = 1; break;
          case "been": v.f.been = 1; break;
          case "plan": v.f.planner = 1; break;
          case "welcome_shown": v.welShown = true; break;
          case "welcome": if (!v.welAct) v.welAct = pr.action || "dismissed"; break;
        }
      });
    });
    visits.forEach(v => {
      /* REACHED OUT = real contact only (Ali, 19 Oct): any WhatsApp button
         (the one top right included) or the Plan page form sent. Not the
         "Book" button, not an email sign-up, not the lead pop-up. */
      v.f.reach = !!(v.f.wa || v.f.waTop || v.f.planForm);
      let ss = null;
      for (const s of v.sids) { if (sidStart.has(s)) { ss = sidStart.get(s); break; } }
      if (!ss && v.start - v.p.first < 30 * 60e3) ss = v.p.ctx;     // first visit, start signal not linked
      v.src = sourceOf(ss);
      if (!v.land) v.land = ss && ss.land ? landKey(ss.land) : "wadis";
      v.len = v.active > 0 ? v.active : v.end - v.start;     // attention time; under 15 s it is the gap between taps
      v.day = localDay(v.start);
      v.country = v.p.country;
      v.device = v.p.device;
    });
    const inCur = v => v.start >= R.cs && v.start < R.ce;
    const cur = visits.filter(inCur);
    const prev = R.ps != null ? visits.filter(v => v.start >= R.ps && v.start < R.cs) : null;
    // what the old tabs read: this range's events of counted people, one id per person
    const curEvents = [];
    for (let i = ev.length - 1; i >= 0; i--) {
      const e = ev[i], t = tOf(e);
      if (t < R.cs || t >= R.ce || e.event === "internal") continue;
      const p = people.get(find(e.device_id));
      if (!p || p.ours || p.bot) continue;
      curEvents.push(Object.assign({}, e, { device_id: p.id }));
    }
    const seenNow = new Set();
    ev.forEach(e => { if (tOf(e) >= R.cs && tOf(e) < R.ce) seenNow.add(find(e.device_id)); });
    let ours = 0, bots = 0;
    seenNow.forEach(id => { const p = people.get(id); if (p && p.ours) ours++; else if (p && p.bot) bots++; });
    const live = new Set();
    ev.forEach(e => { if (NOW - tOf(e) < 5 * 60e3) { const p = people.get(find(e.device_id)); if (p && !p.ours && !p.bot) live.add(p.id); } });
    return { cur, prev, curEvents, R, ours, bots, live: live.size,
             oursDev: [...dev.keys()].filter(d => { const p = people.get(find(d)); return p && p.ours; }),
             merged: [...people.values()].filter(p => p.devs.length > 1 && !p.ours && !p.bot).length,
             oldest: ev.length ? tOf(ev[0]) : NOW };
  }

  /* ----------------------------------------------- counting a set of visits */
  function metricsOf(V) {
    const P = new Set(), O = new Set(), Rr = new Set();
    V.forEach(v => { P.add(v.p.id); if (v.f.spot) O.add(v.p.id); if (v.f.reach) Rr.add(v.p.id); });
    return { people: P.size, visits: V.length, opened: O.size, reached: Rr.size };
  }
  const peopleWhere = (V, f) => { const s = new Set(); V.forEach(v => { if (f(v)) s.add(v.p.id); }); return s.size; };

  const DIMS = {
    source:  { tab: "Sources",   col: "Source",     keys: v => [v.src.ch],                label: k => k },
    sub:     { tab: "Sources",   col: "Tag",        keys: v => [v.src.sub || SUBNONE],     label: k => k },
    land:    { tab: "Landed on", col: "First page", keys: v => [v.land],                  label: pageName },
    page:    { tab: "Pages",     col: "Page",       keys: v => [...v.pages],              label: pageName },
    place:   { tab: "Places",    col: "Place",      keys: v => [...v.places],             label: placeName },
    country: { tab: "Countries", col: "Country",    keys: v => [v.country],               label: k => k },
    device:  { tab: "Devices",   col: "Device",     keys: v => [v.device],                label: k => k },
    day:     { tab: "Days",      col: "Day",        keys: v => [v.day],                   label: k => dayLabelOf(k) }
  };
  const DIM_ORDER = ["source", "land", "page", "place", "country", "device", "day"];
  const FILTER_NAMES = { source: "Source", sub: "Tag", land: "Landed on", page: "Page", place: "Place",
    country: "Country", device: "Device" };
  const passes = v => filters.every(f => DIMS[f.dim].keys(v).includes(f.key));

  function rowsOf(V, dim) {
    const m = new Map();
    V.forEach(v => new Set(DIMS[dim].keys(v)).forEach(k => {
      if (!m.has(k)) m.set(k, []); m.get(k).push(v);
    }));
    return [...m.entries()].map(([key, list]) => {
      const r = Object.assign({ key }, metricsOf(list));
      if (dim === "place") r.dirs = peopleWhere(list, v => v.maps.has(key));
      return r;
    });
  }

  /* chart slots: hours for one day or the last 24 hours, else days */
  function slotsOf(V, R, oldest) {
    let S;
    if (R.hourly && day) {
      S = Array.from({ length: 24 }, (_, h) => ({ key: h, short: pad(h) + ":00",
        long: dayLabelOf(day) + ", " + pad(h) + ":00" }));
      const by = S.map(() => []);
      V.forEach(v => by[new Date(v.start).getHours()].push(v));
      return S.map((s, i) => Object.assign(s, metricsOf(by[i])));
    }
    if (R.hourly) {
      const base = Math.floor(NOW / 3600e3) * 3600e3 - 23 * 3600e3;
      S = Array.from({ length: 24 }, (_, i) => { const d = new Date(base + i * 3600e3);
        return { key: i, short: pad(d.getHours()) + ":00", long: dayLabelOf(localDay(d)) + ", " + pad(d.getHours()) + ":00" }; });
      const by = S.map(() => []);
      V.forEach(v => by[Math.max(0, Math.min(23, Math.floor((v.start - base) / 3600e3)))].push(v));
      return S.map((s, i) => Object.assign(s, metricsOf(by[i])));
    }
    const first = localDay(R.cs || oldest), last = custom ? custom.to : today();
    S = [];
    for (let k = first, guard = 0; k <= last && guard < 4000; k = addDays(k, 1), guard++)
      S.push({ key: k, short: dayStart(k).toLocaleDateString("en-GB", { day: "numeric", month: "short" }), long: dayLabelOf(k) });
    const idx = new Map(S.map((s, i) => [s.key, i])), by = S.map(() => []);
    V.forEach(v => { const i = idx.get(v.day); if (i != null) by[i].push(v); });
    return S.map((s, i) => Object.assign(s, metricsOf(by[i])));
  }

  const shortDay = k => dayStart(k).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const customDays = () => Math.round((dayStart(custom.to) - dayStart(custom.from)) / 864e5) + 1;
  const rangeText = () => day
    ? (day === today() ? "Today" : day === addDays(today(), -1) ? "Yesterday" : dayLabelOf(day))
    : custom ? shortDay(custom.from) + " to " + shortDay(custom.to)
    : days === 1 ? "Last 24 hours" : days === 90 ? "Last 3 months" : days ? "Last " + days + " days" : "All time";
  const cmpText = () => day ? "vs the day before" : custom ? "vs the " + customDays() + " days before" : days === 1 ? "vs the 24 hours before"
    : days === 90 ? "vs the 3 months before" : days ? "vs the " + days + " days before" : "";
  function delta(a, b) {
    if (b == null) return { t: "", c: "" };
    if (!b) return a ? { t: "new", c: "up" } : { t: "no change", c: "" };
    const d = Math.round((a - b) / b * 100);
    return d === 0 ? { t: "no change", c: "" } : { t: (d > 0 ? "▲ " : "▼ ") + Math.abs(d) + "%", c: d > 0 ? "up" : "down" };
  }
  const pct = (n, of) => of ? Math.round(n / of * 100) + "%" : "";

  function drawPerf(v) {
    const M = DATA.M;
    const V = M.cur.filter(passes), PV = M.prev ? M.prev.filter(passes) : null;
    const tot = metricsOf(V), ptot = PV ? metricsOf(PV) : null;
    if (!MET.some(m => selM[m.id])) selM.people = true;
    const sel = MET.filter(m => selM[m.id]);
    const dim = dimTab === "source" && filters.some(f => f.dim === "source") ? "sub" : dimTab;
    const upd = new Date(NOW).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

    /* ---- table rows: sort, page ---- */
    const cols = [
      { id: "people", h: "People", s: "People" }, { id: "visits", h: "Visits", s: "Visits" },
      dim === "place" ? { id: "dirs", h: "Took directions", s: "Directions" } : { id: "opened", h: "Opened a place", s: "Opened" },
      { id: "reached", h: "Reached out", s: "Reached" }
    ];
    let rows = rowsOf(V, dim);
    const sKey = sortBy && (sortBy === "key" || cols.some(c => c.id === sortBy)) ? sortBy
      : dim === "day" ? "key" : (sel[0] ? sel[0].id : "people");
    const sDir = sortBy ? sortDir : -1;
    rows.sort((a, b) => sKey === "key"
      ? (a.key < b.key ? -1 : a.key > b.key ? 1 : 0) * sDir
      : ((a[sKey] - b[sKey]) * sDir) || (b.people - a.people) || String(a.key).localeCompare(String(b.key)));
    const PER = 10, pages = Math.max(1, Math.ceil(rows.length / PER));
    if (pageNo >= pages) pageNo = pages - 1;
    const shown = rows.slice(pageNo * PER, pageNo * PER + PER);
    const lbl = k => DIMS[dim].label(k);

    /* ---- what people did ---- */
    const did = [
      ["Opened a place", x => x.f.spot, "#00897b"],
      ["Opened the Plan page", x => x.pages.has("plan")],
      ["Reached out (any of the three below)", x => x.f.reach, "#e8710a"],
      ["  Tapped a WhatsApp button", x => x.f.wa, "#e8710a"],
      ["  Tapped WhatsApp top right", x => x.f.waTop, "#e8710a"],
      ["  Sent the Plan page form", x => x.f.planForm, "#e8710a"],
      ["Sent the lead pop-up (Leads tab)", x => x.f.form],
      ["Tapped Book (scrolls to the plan)", x => x.f.book],
      ["Gave an email", x => x.f.email],
      ["Took directions (Google Maps)", x => x.f.maps],
      ["Tapped car rental or a partner link", x => x.f.partner],
      ["Opened Hussain's Instagram", x => x.f.insta],
      ["Searched", x => x.searches.length],
      ["Saved a place", x => x.f.save],
      ["Ticked “been there”", x => x.f.been],
      ["Used the trip planner", x => x.f.planner]
    ].map(([l, f, c]) => ({ l, n: peopleWhere(V, f), c })).filter((r, i) => r.n || i < 3);
    const didMax = Math.max(1, ...did.map(r => r.n));

    /* ---- welcome screen, same people basis ---- */
    const sawP = new Set(V.filter(x => x.welShown).map(x => x.p.id));
    const actP = new Map();
    V.forEach(x => { if (x.welAct && sawP.has(x.p.id) && !actP.has(x.p.id)) actP.set(x.p.id, x.welAct); });
    const wn = a => [...actP.values()].filter(x => x === a).length;
    const wel = { saw: sawP.size, plan: wn("plan"), explore: wn("explore"), left: sawP.size - actP.size };

    /* ---- the video, headline only: the full picture is the Video tab ---- */
    const VM = vslModel(V), vS = VM.P.filter(o => o.st), vH = vS.filter(o => o.heard),
          vL = vH.map(o => o.ss).filter(x => x > 0),
          vid = { st: vS.length, heard: vH.length, end: vH.filter(o => o.end).length,
                  avg: vL.length ? vL.reduce((x, y) => x + y, 0) / vL.length : 0 };

    /* ---- the Cheat Sheet, same people basis (31 Oct) ---- */
    const pdf = { saw: peopleWhere(V, x => x.f.pdfSeen), open: peopleWhere(V, x => x.f.pdfOpen),
                  tap: peopleWhere(V, x => x.f.pdfCheckout), buy: peopleWhere(V, x => x.f.pdfBuy) };

    /* ---- visit length ---- */
    const LB = [["Under 30 seconds", 30e3], ["30 sec to 2 min", 120e3], ["2 to 5 min", 300e3],
                ["5 to 15 min", 900e3], ["Over 15 min", Infinity]];
    const lens = LB.map(([l]) => ({ l, n: 0 }));
    V.forEach(x => { lens[LB.findIndex(b => x.len < b[1])].n++; });
    const lenMax = Math.max(1, ...lens.map(r => r.n));
    const medLen = median(V.map(x => x.len));

    /* ---- searches: the search box logs as they type ("d", "da", "day"), so
       only the last word of each burst of typing counts: what they stopped on ---- */
    const sq = new Map();
    V.forEach(x => {
      const list = x.searches.slice().sort((a, b) => a[0] - b[0]);
      list.forEach((s, i) => {
        const next = list[i + 1];
        if (next && next[0] - s[0] < 20e3) return;          // still typing
        if (s[1].length < 2) return;
        const cur = sq.get(s[1]) || { q: s[1], who: new Set(), none: false };
        cur.who.add(x.p.id); if (!s[2]) cur.none = true; sq.set(s[1], cur);
      });
    });
    const searches = [...sq.values()].map(s => ({ q: s.q, n: s.who.size, none: s.none }))
      .sort((a, b) => b.n - a.n || a.q.localeCompare(b.q)).slice(0, 10);
    const sMax = Math.max(1, ...searches.map(s => s.n));

    /* ---- errors ---- */
    const errs = new Map();
    V.forEach(x => x.errors.forEach(m => { if (!errs.has(m)) errs.set(m, new Set()); errs.get(m).add(x.p.id); }));

    const hb = (l, n, max, of, extra, color) => `<div class="hb"${color ? ` style="--c:${color}"` : ""}>
      <span class="l">${esc(l)}${extra || ""}</span>
      <span class="n">${nf(n)}${of != null ? `<small>${pct(n, of)}</small>` : ""}</span>
      <span class="bar"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span></div>`;

    v.innerHTML = `<div class="pf">
      <div class="pf-top">
        <div><h1>Performance</h1><div class="upd">Updated ${esc(upd)} · everyone who opened exploresoman.com</div></div>
        ${M.live ? `<span class="live"><i></i>${nf(M.live)} on the site now</span>` : ""}
      </div>
      <div class="chips">
        <span class="chip date">Date: <b>${esc(rangeText())}</b></span>
        ${filters.map((f, i) => `<span class="chip">${esc(FILTER_NAMES[f.dim])}: <b>${esc(DIMS[f.dim].label(f.key))}</b>
          <button data-unf="${i}" aria-label="Remove filter" title="Remove filter">×</button></span>`).join("")}
        <span class="hint">${filters.length ? "Everything below is filtered." : "Click any row in the table to filter the whole page."}</span>
      </div>
      <div class="cards">${MET.map(m => { const d = delta(tot[m.id], ptot ? ptot[m.id] : null);
        return `<button class="card${selM[m.id] ? " on" : ""}" data-m="${m.id}" style="--c:${m.c}" aria-pressed="${!!selM[m.id]}">
          <span class="lbl"><span class="ck"></span>${esc(m.label)}</span>
          <span class="v">${nf(tot[m.id])}</span>
          <span class="d ${d.c}">${d.t ? esc(d.t) + `<em> ${esc(cmpText())}</em>` : esc(rangeText())}</span></button>`; }).join("")}</div>
      <div class="chartp" id="chartp"><div class="tip" id="tip"></div></div>
      ${ptot ? `<div class="cmpnote">Arrows compare with ${esc(cmpText().replace(/^vs /, ""))}.</div>` : ""}

      <div class="dimp">
        <div class="dtabs">${DIM_ORDER.map(k => `<button data-dim="${k}" class="${dimTab === k ? "on" : ""}">${esc(DIMS[k].tab)}</button>`).join("")}</div>
        <div class="dtbl">${rows.length ? `<table><thead><tr>
          <th data-sort="key" class="${sKey === "key" ? "sorted" : ""}">${esc(DIMS[dim].col)}${sKey === "key" ? `<span class="ar">${sDir > 0 ? "↑" : "↓"}</span>` : ""}</th>
          ${cols.map(c => `<th class="num ${sKey === c.id ? "sorted" : ""}" data-sort="${c.id}">${sKey === c.id ? `<span class="ar">${sDir > 0 ? "↑" : "↓"}</span>` : ""}<span class="lg">${esc(c.h)}</span><span class="sm">${esc(c.s)}</span></th>`).join("")}
          </tr></thead><tbody>${shown.map(r => `<tr data-key="${esc(r.key)}">
            <td class="nm">${esc(lbl(r.key))}</td>
            ${cols.map(c => `<td class="num">${r[c.id] ? nf(r[c.id]) : `<span class="zero">0</span>`}</td>`).join("")}
          </tr>`).join("")}</tbody></table>` : `<div class="empty">Nobody in this range${filters.length ? " with these filters" : ""}.</div>`}</div>
        <div class="pager"><button class="ex" id="pfCsv">Export</button>
          ${rows.length ? `${pageNo * PER + 1}–${Math.min(rows.length, pageNo * PER + PER)} of ${rows.length}` : ""}
          <button id="pgPrev" aria-label="Previous page" ${pageNo ? "" : "disabled"}>‹</button>
          <button id="pgNext" aria-label="Next page" ${pageNo < pages - 1 ? "" : "disabled"}>›</button></div>
      </div>

      <div class="grid2">

  /* ---------------------------------------------------------- the line chart
     One line per selected card, each on its own scale (the way Search
     Console does it): the first selected number labels the left axis, the
     second the right. Hover or tap anywhere for that day's numbers. */
  function drawChart(S, sel) {
    const box = $("#chartp");
    if (!box) return;
    const tip = $("#tip");
    [...box.querySelectorAll("svg")].forEach(x => x.remove());
    const W = Math.max(280, box.clientWidth - 16), H = W < 560 ? 210 : 260;
    const pl = 44, pr = sel.length > 1 ? 44 : 16, pt = 12, pb = 28, iw = W - pl - pr, ih = H - pt - pb, n = S.length;
    const X = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1));
    const step = x => { if (x <= 1) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p;
      return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
    const tops = sel.map(m => step(Math.max(1, ...S.map(s => s[m.id])) / 4) * 4);
    const Y = (val, k) => pt + ih - (val / tops[k]) * ih;
    const NS = "http://www.w3.org/2000/svg";
    let g = "";
    for (let q = 0; q <= 4; q++) {
      const y = pt + ih - q / 4 * ih;
      g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="${q ? "#e8eaed" : "#dadce0"}"/>`;
      if (q && sel[0]) g += `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5f6368">${nf(tops[0] * q / 4)}</text>`;
      if (q && sel[1]) g += `<text x="${W - pr + 8}" y="${y + 4}" font-size="11" fill="#5f6368">${nf(tops[1] * q / 4)}</text>`;
    }
    const every = Math.max(1, Math.ceil(n / (W < 560 ? 4 : 8)));
    S.forEach((s, i) => { if (i % every === 0 || (n <= 8)) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#5f6368">${esc(s.short)}</text>`; });
    sel.forEach((m, k) => {
      if (n === 1) { g += `<circle cx="${X(0)}" cy="${Y(S[0][m.id], k)}" r="4" fill="${m.c}"/>`; return; }
      const d = S.map((s, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(s[m.id], k).toFixed(1)).join(" ");
      g += `<path d="${d}" fill="none" stroke="${m.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    g += `<line id="vl" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" stroke="#80868b" stroke-width="1" visibility="hidden"/>`;
    sel.forEach((m, k) => { g += `<circle class="dot" data-k="${k}" r="4.5" fill="${m.c}" stroke="#fff" stroke-width="2" visibility="hidden"/>`; });
    g += `<rect x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent" id="hit"/>`;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", sel.map(m => m.label).join(" and ") + " over " + rangeText().toLowerCase());
    svg.innerHTML = g;
    box.insertBefore(svg, tip);
    const vl = svg.querySelector("#vl"), dots = [...svg.querySelectorAll(".dot")];
    const show = ev => {
      const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
      const i = Math.max(0, Math.min(n - 1, Math.round(n <= 1 ? 0 : (x - pl) / iw * (n - 1))));
      const cx = X(i);
      vl.setAttribute("x1", cx); vl.setAttribute("x2", cx); vl.setAttribute("visibility", "visible");
      dots.forEach(dt => { const k = +dt.dataset.k; dt.setAttribute("cx", cx); dt.setAttribute("cy", Y(S[i][sel[k].id], k)); dt.setAttribute("visibility", "visible"); });
      tip.innerHTML = `<div class="t">${esc(S[i].long)}</div>` + sel.map(m =>
        `<div class="r"><i style="background:${m.c}"></i>${esc(m.label)}<b>${nf(S[i][m.id])}</b></div>`).join("");
      tip.style.display = "block";
      const tw = tip.offsetWidth, left = cx + 8 + 14 + tw > box.clientWidth ? cx + 8 - 14 - tw : cx + 8 + 14;
      tip.style.left = Math.max(4, left) + "px"; tip.style.top = "18px";
    };
    const hide = () => { vl.setAttribute("visibility", "hidden"); dots.forEach(dt => dt.setAttribute("visibility", "hidden")); tip.style.display = "none"; };
    const hit = svg.querySelector("#hit");
    hit.addEventListener("pointermove", show);
    hit.addEventListener("pointerdown", show);
    hit.addEventListener("pointerleave", hide);
  }
  let rsT = null;

  /* CHEAT SHEET PRE-ORDERS (31 Oct): the "Cheat Sheet buyer" bookings rows,
     our phones left out, one row per WhatsApp number (a buyer who tapped Pay

  function poRows() {

  /* One series, so no legend — the heading names it. Gridlines are hairlines
     behind the marks; the peak is direct-labelled by colour AND named in the
     axis, never colour alone. Every bar carries a hover tooltip. */
  function chart(series) {
    if (!series.length) return `<div class="panel"><div class="empty">No days yet.</div></div>`;
    const max = Math.max(1, ...series.map(s => s.n));
    const nice = max <= 4 ? max : Math.ceil(max / 4) * 4;
    // Small counts (an hour, a quiet day) get one line per whole number;
    // quarters of 1 or 3 rounded to "0, 1, 1, 1".
    const steps = nice < 4 ? Array.from({ length: nice }, (_, i) => (i + 1) / nice) : [0.25, 0.5, 0.75, 1];
    const lines = steps.map(f =>
      `<i style="bottom:${f * 100}%"></i><b style="bottom:${f * 100}%">${Math.round(nice * f)}</b>`).join("");
    const lab = s => s.label || dayLabelOf(s.day);
    const bars = series.map(s =>
      `<div class="b${s.n === max && max > 0 ? " peak" : ""}"
            style="height:${Math.max(2, s.n / nice * 100)}%">
        <span>${esc(lab(s))} — <b>${nf(s.n)}</b> ${s.n === 1 ? "person" : "people"}</span>
       </div>`).join("");
    return `<div class="panel"><div class="chartwrap">
      <div class="grid">${lines}</div>
      <div class="bars">${bars}</div>
      <div class="axis"><span>${esc(lab(series[0]))}</span>
        <span>peak ${nf(max)} ${series[0].hour != null ? "at" : "on"} ${esc(lab(series.find(x => x.n === max) || series[0]))}</span>
        <span>${esc(lab(series[series.length - 1]))}</span></div>

  }

  /* ========================= THE VIDEO (Ali, 25 Oct) ===========================
     The VSL at the top of Plan for me, in SECONDS. One row per person, all
     their visits in the range added up.
       heard   = played with the sound on (muted autoplay nobody turned up
                 is not watching)
       far     = the furthest second they reached with sound
       ss      = seconds actually played with sound (vsl_watch); if that never
                 arrived, the furthest second stands in and the row says "~"
       rS      = seconds heard when they FIRST reached out: sent with the tap
                 since 25 Oct (exact), older taps from the 10-second marks (~)
     ============================================================================ */
  function vslModel(V) {
    const VP = new Map();
    V.forEach(x => {
      const q = x.vsl, k = x.p.id;
      let o = VP.get(k);
      if (!o) VP.set(k, o = { p: x.p, src: x.src, first: 0, st: 0, starts: 0, auto: 0, on: 0, how: "", onAt: null,
        far: 0, mfar: 0, ss: 0, est: 0, fs: 0, end: 0, dur: 0, pr: [], pauses: [], seeks: [], exitAt: null,
        reach: 0, reachT: 0, rHeard: null, rVia: "" });
      if (q && q.t0) {
        o.st = 1; o.starts += q.starts || 1;
        if (!o.first || q.t0 < o.first) { o.first = q.t0; o.src = x.src; }
        if (q.mode === "sound") o.auto = 1;
        if (q.sndT) { o.on = 1; o.how = o.how || q.how; if (o.onAt == null && q.onAt != null) o.onAt = q.onAt; }
        o.far = Math.max(o.far, q.sfar || 0); o.mfar = Math.max(o.mfar, q.mfar || 0);
        if (q.fs) o.fs = 1; if (q.send) o.end = 1; o.dur = Math.max(o.dur, q.dur || 0);
        if (q.ss) o.ss += q.ss; else if (q.sfar) { o.ss += q.sfar; o.est = 1; }
        (q.pr || []).forEach(r => o.pr.push(r));
        (q.pauses || []).forEach(r => o.pauses.push(r));
        (q.seeks || []).forEach(r => o.seeks.push(r));
        if (q.exitAt != null) o.exitAt = q.exitAt;
      }
      if (x.f.reach) {
        o.reach = 1;
        if (x.reachT && (!o.reachT || x.reachT < o.reachT)) { o.reachT = x.reachT; o.rHeard = x.reachHeard; o.rVia = x.reachVia || ""; }
      }
    });
    const P = [...VP.values()];
    const DUR = Math.max(142, ...P.map(o => o.dur || 0));
    P.forEach(o => {
      o.heard = !!(o.st && (o.auto || o.on));
      if (o.heard && (o.end || o.far >= DUR - 2)) { o.end = 1; o.far = DUR; }
      if (o.reach && o.st && o.reachT) {
        if (o.rHeard != null) { o.rS = +o.rHeard; o.rEst = false; }
        else { let m = 0; o.pr.forEach(([t, S, snd]) => { if (snd && t <= o.reachT) m = Math.max(m, S); }); o.rS = m; o.rEst = true; }
      }
    });
    return { P, DUR };
  }

  function drawVideo(v) {
    const { P, DUR } = vslModel(DATA.M.cur);
    const S = P.filter(o => o.st), H = S.filter(o => o.heard);
    const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
    const sx = s => secs(Math.round(s) * 1000);
    const hb = (l, n, max, of, extra, color) => `<div class="hb"${color ? ` style="--c:${color}"` : ""}>
      <span class="l">${esc(l)}${extra || ""}</span>
      <span class="n">${nf(n)}${of != null ? `<small>${pct(n, of)}</small>` : ""}</span>
      <span class="bar"><i style="width:${(n / max * 100).toFixed(1)}%"></i></span></div>`;
    const avgOf = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    const medOf = a => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : 0; };
    if (!S.length) {
      v.innerHTML = `<h2 class="sec">The video</h2><div class="panel"><div class="empty">Nobody played the video in this range.</div></div>`;
      return;
    }
    /* headline */
    const lis = H.map(o => o.ss).filter(x => x > 0), lisEst = H.some(o => o.est);
    const ends = H.filter(o => o.end).length;
    const RV = P.filter(o => o.reach && o.st && o.reachT && o.rS != null);
    const rNone = P.filter(o => o.reach && !o.st).length;
    const rAvg = avgOf(RV.map(o => o.rS)), rEst = RV.some(o => o.rEst);
    /* still listening, every 5 seconds */
    const curve = [];
    for (let s = 0; s <= DUR; s += 5) curve.push({ label: mmss(s), n: H.filter(o => o.far >= s).length });
    /* 10-second ranges */
    const NB = Math.ceil(DUR / 10), lab = b => b * 10 + "–" + Math.min(DUR, b * 10 + 10) + "s";
    const bin = s => Math.min(NB - 1, Math.max(0, Math.floor(s / 10)));
    const rows = Array.from({ length: NB }, (_, b) => ({ b, l: lab(b), stop: 0, pause: 0, skip: 0, left: 0, reach: 0 }));
    H.forEach(o => { if (!o.end) rows[bin(o.far)].stop++; });
    S.forEach(o => {
      o.pauses.forEach(r => rows[bin(r[1])].pause++);
      o.seeks.forEach(r => rows[bin(r[1])].skip++);
      if (o.exitAt != null && !o.end) rows[bin(o.exitAt)].left++;
    });
    RV.forEach(o => { if (o.rS >= 1) rows[bin(o.rS)].reach++; });
    const worst = rows.reduce((a, r) => r.stop > a.stop ? r : a, rows[0]);
    const rowCols = [
      { h: "Part of the video", get: r => esc(r.l), raw: r => r.l },
      { h: "Stopped listening here", cls: "num", get: r => r.stop ? `${nf(r.stop)} <small class="zero">${pct(r.stop, H.length)}</small>` : z(0), raw: r => r.stop },
      { h: "Left the page here", cls: "num", get: r => z(r.left), raw: r => r.left },
      { h: "Paused here", cls: "num", get: r => z(r.pause), raw: r => r.pause },
      { h: "Skipped from here", cls: "num", get: r => z(r.skip), raw: r => r.skip },
      { h: "Reached out after hearing up to here", cls: "num", get: r => z(r.reach), raw: r => r.reach }
    ];
    /* sound */
    const auto = S.filter(o => o.auto).length, onTap = S.filter(o => !o.auto && o.on && o.how === "tap").length,
          onBtn = S.filter(o => !o.auto && o.on && o.how !== "tap").length, mute = S.length - H.length;
    const onAts = S.filter(o => !o.auto && o.on && o.onAt != null).map(o => o.onAt);
    const muteFar = S.filter(o => !o.heard).map(o => o.mfar);
    const fs = S.filter(o => o.fs).length, again = S.filter(o => o.starts > 1).length;
    /* reaching out, 10-second ranges */
    const rr = Array.from({ length: NB }, (_, b) => ({ l: "Heard " + lab(b), n: 0 }));
    let rZero = 0;
    RV.forEach(o => { if (o.rS < 1) rZero++; else rr[bin(o.rS)].n++; });
    const rrMax = Math.max(1, rZero, rNone, ...rr.map(r => r.n));
    const rate = f => { const a = P.filter(f); return { n: a.filter(o => o.reach).length, of: a.length }; };
    const R60 = rate(o => o.heard && o.far >= 60), R30 = rate(o => o.heard && o.far >= 30 && o.far < 60),
          R0 = rate(o => o.st && !(o.heard && o.far >= 30)), RN = rate(o => !o.st);
    /* breakdowns */
    const brk = key => {
      const m = new Map();
      S.forEach(o => {
        const k = key(o) || "Unknown", r = m.get(k) || { k, st: 0, heard: 0, lis: [], far: [], end: 0, reach: 0 };
        r.st++; if (o.heard) { r.heard++; r.far.push(o.far); if (o.ss > 0) r.lis.push(o.ss); }
        if (o.end) r.end++; if (o.reach) r.reach++; m.set(k, r);
      });
      return [...m.values()].sort((a, b) => b.st - a.st);
    };
    const brkCols = name => [
      { h: name, get: r => esc(r.k), raw: r => r.k },
      { h: "Saw it start", cls: "num", get: r => z(r.st), raw: r => r.st },
      { h: "Heard it with sound", cls: "num", get: r => `${z(r.heard)} <small class="zero">${pct(r.heard, r.st)}</small>`, raw: r => r.heard },
      { h: "Average listen", cls: "num", get: r => r.lis.length ? sx(avgOf(r.lis)) : "—", raw: r => Math.round(avgOf(r.lis)) },
      { h: "Typical stop", cls: "num", get: r => r.far.length ? mmss(medOf(r.far)) : "—", raw: r => Math.round(medOf(r.far)) },
      { h: "To the end", cls: "num", get: r => z(r.end), raw: r => r.end },
      { h: "Reached out", cls: "num", get: r => `${z(r.reach)} <small class="zero">${pct(r.reach, r.st)}</small>`, raw: r => r.reach }
    ];
    /* daily */
    const dm = new Map();
    S.forEach(o => { const d = localDay(o.first); dm.set(d, (dm.get(d) || 0) + 1); });
    const daily = [...dm.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([day, n]) => ({ day, n }));
    /* every person */
    const people = [...S].sort((a, b) => b.first - a.first);
    const soundTxt = o => o.auto ? "by itself" : o.on ? (o.how === "tap" ? "tap" : "button") + (o.onAt != null ? " at " + mmss(o.onAt) : "") : "never";
    const reachTxt = o => !o.reach ? "—" : !o.reachT || o.rS == null ? "yes" :
      `${esc(o.rVia || "yes")} after ${o.rEst ? "~" : ""}${sx(o.rS)}`;
    const pCols = [
      { h: "When", get: o => esc(fmtDate(new Date(o.first).toISOString())), raw: o => new Date(o.first).toISOString() },
      { h: "Phone", get: o => esc(o.p.device || "—"), raw: o => o.p.device },
      { h: "Country", get: o => esc(o.p.country || "—"), raw: o => o.p.country },
      { h: "Came from", get: o => esc((o.src && o.src.ch) || "—"), raw: o => o.src && o.src.ch },
      { h: "Sound on", get: o => esc(soundTxt(o)), raw: o => soundTxt(o) },
      { h: "Got to", cls: "num", get: o => o.heard ? (o.end ? "the end" : mmss(o.far)) : `<span class="zero">muted ${mmss(o.mfar)}</span>`, raw: o => o.heard ? Math.round(o.far) : "" },
      { h: "Listened", cls: "num", get: o => o.ss > 0 ? (o.est ? "~" : "") + sx(o.ss) : z(0), raw: o => Math.round(o.ss) },
      { h: "Left at", cls: "num", get: o => o.exitAt != null && !o.end ? mmss(o.exitAt) : "—", raw: o => o.exitAt },
      { h: "Paused", cls: "num", get: o => z(o.pauses.length), raw: o => o.pauses.length },
      { h: "Skipped", cls: "num", get: o => z(o.seeks.length), raw: o => o.seeks.length },
      { h: "Full screen", get: o => o.fs ? "yes" : "—", raw: o => o.fs ? "yes" : "" },
      { h: "Plays", cls: "num", get: o => nf(o.starts), raw: o => o.starts },
      { h: "Reached out", get: o => reachTxt(o), raw: o => !o.reach ? "" : (o.rVia || "yes") + (o.rS != null ? " after " + Math.round(o.rS) + "s" : "") }
    ];

    v.innerHTML = `
      <h2 class="sec">The video</h2>
      <p class="note">The ${mmss(DUR)} video at the top of Plan for me, ${esc(custom ? "from " + rangeText() : rangeText().toLowerCase())}. <b>Heard</b> means played with
        the sound on: a muted autoplay nobody turned up is not counted as watching. Every time is a point in the video,
        <b>0:30</b> = thirty seconds in. Counting since 25 Oct; exact seconds before reaching out since the evening of 25 Oct
        (earlier ones are marked ~).</p>
      <div class="box"><div class="wel">
        <div><b>${nf(S.length)}</b><span>saw it start</span></div>
        <div><b>${nf(H.length)}</b><span>heard it with sound ${pct(H.length, S.length)}</span></div>
        <div><b>${lis.length ? (lisEst ? "~" : "") + sx(avgOf(lis)) : "—"}</b><span>average listen${lis.length ? " · typical " + sx(medOf(lis)) : ""}</span></div>
        <div><b>${nf(ends)}</b><span>heard it to the end ${pct(ends, S.length)}</span></div>
        <div><b>${nf(RV.length + rNone)}</b><span>reached out ${pct(RV.length + rNone, P.length)} of everyone in range</span></div>
        <div><b>${RV.length ? (rEst ? "~" : "") + sx(rAvg) : "—"}</b><span>heard on average before reaching out</span></div>
        <div><b>${nf(fs)}</b><span>went full screen</span></div>
        <div><b>${nf(again)}</b><span>played it more than once</span></div></div></div>

      <h2 class="sec">Still listening</h2>
      <p class="note">Of the ${nf(H.length)} who heard it with sound, how many were still listening at each point.
        ${worst.stop ? `The most stopped between <b>${esc(worst.l)}</b>: ${nf(worst.stop)} ${worst.stop === 1 ? "person" : "people"}.` : ""}</p>
      ${H.length ? chart(curve) : `<div class="panel"><div class="empty">Nobody heard it with sound yet.</div></div>`}

      <h2 class="sec">Where they clicked off</h2>
      <p class="note">Every 10 seconds of the video. <b>Stopped listening</b> = the furthest point they reached with sound.
        <b>Left the page</b> = where the video was when they left.</p>
      <div class="panel">${dataTable(rows, rowCols)}</div>

      <div class="grid2">
        <div class="box"><h3>Sound</h3><p class="bs">Of the ${nf(S.length)} who saw it start</p>
          ${hb("Started with sound by itself", auto, Math.max(1, S.length), S.length, "", "#00897b")}
          ${hb("Turned the sound on with a tap", onTap, Math.max(1, S.length), S.length, "", "#00897b")}
          ${hb("Turned the sound on with the button", onBtn, Math.max(1, S.length), S.length, "", "#00897b")}
          ${hb("Only ever saw it muted", mute, Math.max(1, S.length), S.length, "", "#9aa0a6")}
          <p class="bs" style="margin-top:12px">${onAts.length ? `Turned sound on at <b>${mmss(avgOf(onAts))}</b> on average (it then restarts from 0:00).` : ""}
            ${muteFar.length ? ` Muted-only viewers got to <b>${mmss(avgOf(muteFar))}</b> on average.` : ""}</p></div>
        <div class="box"><h3>Reaching out</h3><p class="bs">Everyone who reached out, by how much of the video they had heard at that moment</p>
          ${rr.map(r => r.n ? hb(r.l, r.n, rrMax, null, "", "#e8710a") : "").join("")}
          ${hb("Heard none of it (muted)", rZero, rrMax, null, "", "#9aa0a6")}
          ${hb("Never played the video", rNone, rrMax, null, "", "#9aa0a6")}
          <p class="bs" style="margin-top:12px">Reach-out rate: heard a minute or more <b>${pct(R60.n, R60.of) || "—"}</b> (${nf(R60.n)} of ${nf(R60.of)})
            · heard 30–60s <b>${pct(R30.n, R30.of) || "—"}</b> (${nf(R30.n)} of ${nf(R30.of)})
            · heard under 30s <b>${pct(R0.n, R0.of) || "—"}</b> (${nf(R0.n)} of ${nf(R0.of)})
            · never played it <b>${pct(RN.n, RN.of) || "—"}</b> (${nf(RN.n)} of ${nf(RN.of)})</p></div>
      </div>

      <h2 class="sec">Plays by day</h2>
      ${chart(daily)}

      <h2 class="sec">By where they came from</h2>
      <div class="panel">${dataTable(brk(o => o.src && o.src.ch), brkCols("Came from"))}</div>
      <h2 class="sec">By phone</h2>
      <div class="panel">${dataTable(brk(o => o.p.device), brkCols("Phone"))}</div>
      <h2 class="sec">By country</h2>
      <div class="panel">${dataTable(brk(o => o.p.country), brkCols("Country"))}</div>

      <h2 class="sec">Everyone who saw it start <button class="ex" id="vidCsv" style="margin-left:8px">Export</button></h2>
      <div class="panel">${dataTable(people, pCols)}</div>`;
    const ex = $("#vidCsv");
    if (ex) ex.onclick = () => csv(people, pCols, "video-viewers.csv");
  }

      const cols = [
        { h: "When", get: r => esc(fmtDate(r.created_at)), raw: r => r.created_at },
        { h: "Place", get: r => esc(r.spot || "general"), raw: r => r.spot },
        { h: "Stars", get: r => stars(r.stars), raw: r => r.stars },
        { h: "Verdict", get: r => r.verdict
            ? `<span class="pill ${r.verdict === "up" ? "up" : "down"}">${esc(r.verdict)}</span>` : "—",
          raw: r => r.verdict },
        { h: "Name", get: r => esc(r.name || "—"), raw: r => r.name },
        { h: "What they wrote", cls: "wrap", get: r => esc(r.tip || "—"), raw: r => r.tip },
        { h: "Live", get: r => r.published

        const live = r.published

          off the live site within seconds (no deploy); <b>Publish</b> puts it back;
          <b>Delete</b> is forever. Rows marked <span class="pill down">hidden</span>
          include everything posted before the live system existed.
          <br><br>
          <b>Copy for content.js</b> is for promotion, not publication: it puts a
          ready-made <code>{ text: …, by: … }</code> line on your clipboard for that
          spot's curated <code>travellerTips</code> — the hand-picked list that shows
          even offline.
        </div>
        <div class="panel">${dataTable(revs, cols)}</div>`;
      wireActions(v);
      return;
    }

    if (tab === "events") {
      const cols = [
        { h: "When", get: r => esc(fmtDate(r.created_at)), raw: r => r.created_at },
        { h: "Event", get: r => `<span class="pill">${esc(r.event)}</span>`, raw: r => r.event },
        { h: "Details", cls: "wrap", get: r => esc(typeof r.props === "string"
            ? r.props : JSON.stringify(r.props || {})), raw: r => JSON.stringify(r.props || {}) },
        { h: "Device", get: r => esc(String(r.device_id || "").slice(0, 8)), raw: r => r.device_id }
      ];
      v.innerHTML = `
        <h2 class="sec">Latest ${nf(c.raw.length)} of ${nf(c.events)} events</h2>
        <div class="panel">${dataTable(c.raw, cols)}</div>`;
      return;
    }

  /* Our phones, for the leads lists: marked with ?me=on, on TEST_DEVICES,
     caught by isOurs, or leaving the same WhatsApp number as one of those. */
  function oursIds(raw, ids) {
    const s = new Set(ids);
    const num = c => String(c || "").replace(/\D/g, "");
    const nums = new Set(raw.bookings.filter(b => s.has(b.device_id)).map(b => num(b.contact)).filter(n => n.length >= 7));
    raw.bookings.forEach(b => { if (b.device_id && nums.has(num(b.contact))) s.add(b.device_id); });
    return s;
  }
  const isPdfRow = b => b.name === "Cheat Sheet buyer";

  /* --------------------------------------------------------------- booting */
  let bootN = 0;
  async function boot() {
    const n = ++bootN;
    $("#gate").classList.add("hide");
    $("#app").classList.remove("hide");
    $("#view").innerHTML = `<div class="empty">Loading…</div>`;
    try {
      const raw = await loadAll();
      if (n !== bootN) return;              // a newer range was picked while this one loaded
      const base = raw.internalIds.concat(TEST_DEVICES);
      let M = buildModel(raw.events, base, raw.R);
      const ours = oursIds(raw, base.concat(M.oursDev));
      if (ours.size > new Set(base.concat(M.oursDev)).size) M = buildModel(raw.events, [...ours], raw.R);   // a same-number phone: out of every count too
      // our test rows out of every list; Cheat Sheet orders get their own list, not Leads
      const realB = raw.bookings.filter(b => !ours.has(b.device_id));
      DATA = crunch(Object.assign({}, raw, { events: M.curEvents, dropped: M.ours + M.bots,
                                             bookings: realB.filter(b => !isPdfRow(b)) }));
      DATA.M = M;
      DATA.pdfOrders = realB.filter(isPdfRow);
      DATA.testRows = raw.bookings.length - realB.length;
      if (!TABS.some(t => t[0] === tab)) tab = "performance";
      draw();
      const who = (session && session.user && session.user.email) || "signed in";
      $("#who").textContent = who;
    } catch (e) {
      if (e.auth) { signOut(); return; }
      if (n !== bootN) return;
      $("#view").innerHTML = `<h2 class="sec">Could not load</h2>
        <div class="panel"><p style="margin:0 0 8px">${esc(e.message)}</p>
        <p class="note" style="margin:0">If this says <b>401</b> or the tables come back
        empty, the read policies are not in place yet: run
        <code>delivery/dashboard-access.sql</code> in the Supabase SQL editor, once.</p></div>`;
    }
  }

  $("#loginForm").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#loginBtn"), err = $("#loginErr");
    btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
    try {
      session = await signIn($("#em").value.trim(), $("#pw").value);
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      $("#pw").value = "";
      await boot();
    } catch (ex) {
      err.textContent = ex.message;
    } finally {
      btn.disabled = false; btn.textContent = "Sign in";
    }
  };

  $("#out").onclick = signOut;
  $("#refresh").onclick = boot;
  /* One place moves the range and lights the right control: a 7d/30d
     button, Today/Yesterday, or the date box for any other day. */
  function syncRange() {
    const t = today();
    [...$("#range").children].forEach(x => x.classList.toggle("on", x.dataset.day != null
      ? day === addDays(t, +x.dataset.day)
      : !day && !custom && days === +x.dataset.d));
    [$("#rgFrom"), $("#rgTo")].forEach((x, i) => { x.max = t; x.value = custom ? (i ? custom.to : custom.from) : ""; x.classList.toggle("on", !!custom); });
    const pick = $("#dayPick");
    pick.max = t;
    pick.value = day || "";
    pick.classList.toggle("on", !!day && day !== t && day !== addDays(t, -1));
    $("#dayNext").disabled = !!day && day >= t;
  }
  function setDay(k) {
    if (!k) return;
    custom = null;
    day = k > today() ? today() : k;
    syncRange();
    boot();
  }
  [...$("#range").children].forEach(b => b.onclick = () => {
    if (b.dataset.day != null) return setDay(addDays(today(), +b.dataset.day));
    day = null;
    custom = null;
    days = +b.dataset.d;
    pageNo = 0;
    saveView();
    syncRange();
    boot();
  });
  $("#dayPick").onchange = e => setDay(e.target.value);
  /* FROM-TO: once both boxes are filled (either order); one day in both is the one-day view */
  function setCustom() {
    let a = $("#rgFrom").value, b = $("#rgTo").value;
    if (!a || !b) return;
    const t = today();
    if (a > b) [a, b] = [b, a];
    if (b > t) b = t;
    if (a > t) a = t;
    if (a === b) return setDay(a);
    day = null;
    custom = { from: a, to: b };
    pageNo = 0;
    syncRange();
    boot();
  }
  $("#rgFrom").onchange = $("#rgTo").onchange = setCustom;
  $("#dayPrev").onclick = () => setDay(addDays(day || today(), -1));
  $("#dayNext").onclick = () => setDay(addDays(day || addDays(today(), -1), 1));
  syncRange();

  if (session && session.access_token) boot();
})();
</script>
</body>
</html>
