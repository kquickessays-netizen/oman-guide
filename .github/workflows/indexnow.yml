# Tells Bing (through IndexNow) which pages changed, after every deploy.
#
# Kept separate from deploy-pages.yml on purpose: if this job ever breaks,
# the site still deploys. It only reads the repo. It never changes a file.
# What gets sent and when is explained at the top of .github/scripts/indexnow.py.
name: Tell Bing about changed pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Send changed pages to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: python3 .github/scripts/indexnow.py
